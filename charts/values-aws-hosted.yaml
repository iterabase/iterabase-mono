# Hosted AWS edge preset and static fixture (HOR-601). Pair with values-tls.yaml
# and render as release `opo1` in namespace `portable-system`. A hosted
# environment's overlay layers the same settings with its own values from the
# hosted baseline contract (/iterabase/hosted/baseline/v1/*):
#   - environment name    -> aws-load-balancer-controller.clusterName and
#                            defaultTags.iterabase-env
#   - vpc-id              -> aws-load-balancer-controller.vpcId
#   - origin-pull-ca-cert -> global.originPull.caCert (public CA, not a key)
#   - hosted-domain       -> Ingress hosts <customer>.<hosted-domain> and
#                            <customer>-gateway.<hosted-domain>, and the
#                            external-dns domain filter. Hosts stay one label
#                            below the zone: Cloudflare Universal SSL covers
#                            only the apex and first-level subdomains.
#   - cloudflare-dns-token -> the cloudflare-api-token Secret (overlay secrets)
# Documentation values below (example.app, vpc-0123..., the example CA) are
# fixtures, not real resources.

