# Instance-mode NLB in front of ingress-nginx (PIVOT-ARCH-003). The controller
# owns the NLB, its target group and its security groups; deleting this Service
# removes them. HTTPS only: cert-manager uses DNS-01, so port 80 stays closed and
# the NLB security group admits 443 alone (DES-HOR-601-04).
ingress-nginx:
  controller:
    service:
      loadBalancerClass: service.k8s.aws/nlb
      enableHttp: false
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: instance
        service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
        service.beta.kubernetes.io/aws-load-balancer-ip-address-type: ipv4
      ipFamilyPolicy: SingleStack
      ipFamilies:
        - IPv4

aws-load-balancer-controller:
  enabled: true
  clusterName: example
  vpcId: vpc-0123456789abcdef0
  defaultTags:
    iterabase-env: example

cert-issuers:
  letsencrypt:
    enabled: true
    email: operator@example.com

# Records are Cloudflare-proxied (the default); the origin-pull certificate is
# only presented on proxied requests.
external-dns:
  enabled: true
  domainFilters:
    - example.app.

inference-gateway:
  ingress:
    host: example-gateway.example.app
    tls:
      enabled: true
      clusterIssuer: letsencrypt-prod
    externalDns:
      enabled: true

control-plane:
  ingress:
    enabled: true
    host: example.example.app
    tls:
      enabled: true
      clusterIssuer: letsencrypt-prod
    externalDns:
      enabled: true
