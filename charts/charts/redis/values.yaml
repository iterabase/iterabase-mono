enabled: true

image:
  repository: redis
  tag: "7-alpine"
  digest: sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
  pullPolicy: IfNotPresent

# Redis is hot-path cache only (never source of truth); ephemeral storage in v1.
# Reviewed single-node sizing (HOR-602, charts/docs/sizing.md): CPU request,
# memory request and memory limit; no CPU limit (CPU is compressible).
resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 512Mi

# Internal TLS (opt-in; the umbrella's internalTLS.enabled fans this on in prod).
# When enabled, redis serves TLS only (plaintext port disabled) with a cert-manager
# leaf cert; --tls-auth-clients no (no mTLS). Server-only: it presents a cert,
# never verifies one, so caSecretName is unused here (kept for contract uniformity).
tls:
  enabled: false
  issuerName: internal-ca
  caSecretName: ""
  caMountPath: /etc/iterabase/internal-ca/ca.crt

# AUTH (opt-in; paired with tls by the umbrella — TLS without AUTH is pointless
# for a shared cache). A password generated into a Secret (stable via lookup);
# clients pass it in the rediss:// URL.
auth:
  enabled: false
  password: ""   # default: generated into <release>-redis (key redis-password)

# Metrics (opt-in; flip on with observability — see values-observability.yaml).
# A standalone redis-exporter Deployment + Service + ServiceMonitor (best
# practice: the exporter is a separate stateless pod, not a sidecar). Connects
# with the AUTH password + internal CA when TLS is on; plaintext otherwise. The
# ServiceMonitor is a Prometheus Operator CRD — rendered regardless but only
# reconciled when the operator (from the observability chart) is installed.
metrics:
  enabled: false
  image:
    repository: oliver006/redis_exporter
    tag: "v1.67.0"
    digest: sha256:120f7ec77293459ccfdad66bb1db75ab72e8bfeab99f58b1cc2564cadcd7a9e7
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  # scrapeInterval: 30s
