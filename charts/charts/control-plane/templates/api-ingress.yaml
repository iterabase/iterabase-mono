{{- if .Values.enabled }}
{{- if .Values.ingress.enabled }}
{{- /* The api serves one same-origin control-plane surface: Dashboard static
    UI/assets plus every authenticated /v1/* API. The selected IngressClass owns
    the whole host; deployments may place it on a public or private plane. */ -}}
{{- $ednsHostname := "" -}}
{{- $ednsTarget := "" -}}
{{- $ednsCloudflareProxied := "" -}}
{{- if .Values.ingress.externalDns.enabled -}}
{{- $ednsHostname = .Values.ingress.externalDns.hostname | default .Values.ingress.host -}}
{{- $ednsTarget = .Values.ingress.externalDns.target -}}
{{- $ednsCloudflareProxied = .Values.ingress.externalDns.cloudflareProxied -}}
{{- if and (ne $ednsCloudflareProxied "") (not (has $ednsCloudflareProxied (list "true" "false"))) -}}
{{- fail "control-plane.ingress.externalDns.cloudflareProxied must be empty, \"true\", or \"false\"" -}}
{{- end -}}
{{- end -}}
{{- /* Edge TLS has a dedicated Secret. It must never reuse the internal API
    serving leaf: those certificates have different issuers and SAN scopes. */ -}}
{{- /* Hosted authenticated origin pulls (DES-HOR-601-04): only clients
    presenting a certificate from the umbrella's origin-pull CA reach the edge. */ -}}
{{- $originPull := dig "originPull" "enabled" false (.Values.global | default (dict)) -}}
{{- $tlsEnabled := .Values.ingress.tls.enabled -}}
{{- $tlsSecret := "" -}}
{{- if $tlsEnabled -}}
{{- $_ := required "control-plane.ingress.host is required when ingress.tls.enabled" .Values.ingress.host -}}
{{- $_ = required "control-plane.ingress.tls.clusterIssuer is required when ingress.tls.enabled" .Values.ingress.tls.clusterIssuer -}}
{{- $tlsSecret = .Values.ingress.tls.secretName | default (printf "%s-control-plane-api-ingress-tls" .Release.Name) -}}
{{- end -}}
{{- /* Unlike the inference-gateway (plain HTTP on its edge port even under
    internalTLS), the control-plane api serves HTTPS from an internal-CA leaf.
    Whenever that path is enabled, ingress-nginx verifies the CA and exact
    Service identity rather than providing encryption without authentication. */ -}}
{{- $backendHTTPS := (or .Values.tls.enabled (dig "internalTLS" "enabled" false (.Values.global | default (dict)))) -}}
{{- $apiTLSSecret := include "control-plane.apiTLSSecretName" . -}}
{{- if and $tlsEnabled $backendHTTPS (eq $tlsSecret $apiTLSSecret) -}}
{{- fail "control-plane.ingress.tls.secretName must differ from the internal API TLS Secret when internalTLS is enabled" -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "control-plane.apiName" . }}
  labels:
    {{- include "control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- if or $tlsEnabled $ednsHostname $ednsTarget $ednsCloudflareProxied $backendHTTPS $originPull }}
  annotations:
    {{- if $tlsEnabled }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer | quote }}
    {{- end }}
    {{- if $ednsHostname }}
    external-dns.alpha.kubernetes.io/hostname: {{ $ednsHostname | quote }}
    {{- end }}
    {{- if $ednsTarget }}
    external-dns.alpha.kubernetes.io/target: {{ $ednsTarget | quote }}
    {{- end }}
    {{- if $ednsCloudflareProxied }}
    external-dns.alpha.kubernetes.io/cloudflare-proxied: {{ $ednsCloudflareProxied | quote }}
    {{- end }}
    {{- if $backendHTTPS }}
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/proxy-ssl-secret: {{ printf "%s/%s" .Release.Namespace $apiTLSSecret | quote }}
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "on"
    nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"
    nginx.ingress.kubernetes.io/proxy-ssl-name: {{ printf "%s.%s.svc" (include "control-plane.apiName" .) .Release.Namespace | quote }}
    {{- end }}
    {{- if $originPull }}
    nginx.ingress.kubernetes.io/auth-tls-secret: {{ printf "%s/%s-origin-pull-ca" .Release.Namespace .Release.Name | quote }}
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
    nginx.ingress.kubernetes.io/auth-tls-verify-depth: "1"
    {{- end }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if $tlsEnabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ $tlsSecret | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "control-plane.apiName" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
{{- end }}
