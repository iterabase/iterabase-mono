{{- if and .Values.enabled .Values.metrics.enabled }}
{{- $interval := .Values.metrics.scrapeInterval | default "30s" }}
# All custom serving binaries expose a dedicated plaintext in-cluster metrics
# listener. Customer ingress and mandatory-mTLS RPC listeners remain isolated.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "control-plane.apiName" . }}
  labels:
    {{- include "control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: {{ $interval }}
      relabelings:
        - action: replace
          replacement: api
          targetLabel: component
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "control-plane.managerName" . }}
  labels:
    {{- include "control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: manager
spec:
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: manager
  podMetricsEndpoints:
    - port: {{ .Values.metrics.manager.port | quote }}
      path: /metrics
      interval: {{ $interval }}
      relabelings:
        - action: replace
          replacement: manager
          targetLabel: component
{{- if .Values.gateway.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "control-plane.gatewayName" . }}
  labels:
    {{- include "control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: gateway
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: {{ $interval }}
      relabelings:
        - action: replace
          replacement: gateway
          targetLabel: component
{{- end }}
{{- if .Values.dispatch.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "control-plane.dispatchName" . }}
  labels:
    {{- include "control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: dispatch
spec:
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: dispatch
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: {{ $interval }}
      relabelings:
        - action: replace
          replacement: dispatch
          targetLabel: component
{{- end }}
{{- if include "control-plane.artifactProcessingEnabled" . }}
{{- range $component := list "artifact-coordinator" "artifact-scanner" }}
---
# The coordinator serves metrics on its health-only listener; the scanner on
# its plaintext metrics-only listener, never the mTLS processing port.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ printf "%s-control-plane-%s" $.Release.Name $component }}
  labels:
    {{- include "control-plane.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $component }}
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: {{ $interval }}
      relabelings:
        - action: replace
          replacement: {{ $component }}
          targetLabel: component
{{- end }}
{{- end }}
---
# AgentPool workers are operator-created and may live in another namespace.
# The supervisor exposes bounded metrics on its existing plain-HTTP probe port;
# disposable per-turn children never expose a listener.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "control-plane.name" . }}-harness
  labels:
    {{- include "control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: harness
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane
      app.kubernetes.io/component: harness
      app.kubernetes.io/managed-by: control-plane
  podMetricsEndpoints:
    - port: probe
      path: /metrics
      interval: {{ $interval }}
      relabelings:
        - action: replace
          replacement: harness
          targetLabel: component
{{- if .Values.metrics.vllm.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "control-plane.name" . }}-vllm
  labels:
    {{- include "control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: model-backend
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    {{- toYaml .Values.metrics.vllm.namespaceSelector | nindent 4 }}
  selector:
    {{- toYaml .Values.metrics.vllm.selector | nindent 4 }}
  podMetricsEndpoints:
    - port: {{ .Values.metrics.vllm.port | quote }}
      path: {{ .Values.metrics.vllm.path | quote }}
      interval: {{ $interval }}
      relabelings:
        - action: replace
          replacement: model-backend
          targetLabel: component
{{- end }}
{{- end }}
