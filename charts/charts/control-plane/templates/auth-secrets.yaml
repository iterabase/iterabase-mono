{{- if .Values.enabled }}
{{- if not .Values.auth.bootstrap.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "control-plane.authBootstrapSecretName" . }}
  labels:
    {{- include "control-plane.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.bootstrap.emailKey | default "admin-email" }}: {{ required "auth.bootstrap.adminEmail is required: the deployment overlay names the first Admin" .Values.auth.bootstrap.adminEmail | quote }}
  {{ .Values.auth.bootstrap.localeKey | default "admin-locale" }}: {{ .Values.auth.bootstrap.adminLocale | default "en" | quote }}
{{- end }}
{{- end }}
