enabled: true

image:
  repository: ghcr.io/iterabase/inference-gateway
  tag: "" # default: the chart appVersion, which equals inference-gateway/VERSION
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  port: 8080

ingress:
  enabled: true
  className: nginx
  host: "" # catch-all when empty (HTTP only); REQUIRED when tls.enabled (cert SAN)
  # Maximum request body ingress-nginx accepts. Chat requests with inline
  # base64 images exceed the controller's 1m default.
  proxyBodySize: 32m
  # TLS via the prerequisite cert-manager substrate plus this platform's
  # cert-issuers dependency: clusterIssuer names a rendered ClusterIssuer
  # (selfsigned for kind/E2E, letsencrypt-prod for the prod overlay). cert-manager's
  # ingress-shim issues the cert into secretName (stable across upgrades) and
  # ingress-nginx serves it. Disable (tls.enabled=false) for a plain-HTTP edge.
  tls:
    enabled: false
    secretName: "" # default: <release>-gateway-tls
    clusterIssuer: "" # e.g. selfsigned (kind/E2E) / letsencrypt-prod (prod overlay)
  # external-dns integration (prod edge). When enabled, annotate this Ingress so
  # external-dns (source: ingress) creates the Cloudflare A record for the host.
  # Set inference-gateway.ingress.externalDns.enabled=true in the prod overlay
  # alongside external-dns.enabled=true (umbrella). No-op on kind/E2E.
  externalDns:
    enabled: false
    hostname: "" # DNS record name; defaults to ingress.host when empty
    target: "" # optional A-record target (IP/host); if unset external-dns uses the Ingress status.loadBalancer

# PostgreSQL connection. Defaults match the bundled postgresql subchart.
# To BYO: set postgresql.enabled=false (umbrella) and override these.
postgresql:
  host: "" # default: <release>-postgresql
  port: 5432
  database: controlplane
  username: gateway
  passwordSecret: "" # default: <release>-postgresql
  passwordKey: gateway-password

# Internal TLS (opt-in; the umbrella's internalTLS.enabled fans this on). The
# gateway is a TLS client only (no internal HTTPS server — its public edge is
# via ingress-shim). When enabled: DATABASE_URL uses sslmode=verify-full + the
# internal CA. Rate limits live in the same Postgres (DES-HOR-661-07); there is
# no Redis. caSecretName is required when enabled (the <release>-internal-ca-root Secret, set by umbrella).
tls:
  enabled: false
  caSecretName: ""   # required when enabled: the internal CA root Secret
  caMountPath: /etc/iterabase/internal-ca/ca.crt

# Admin API key — generated into a Secret on first install (stable via lookup).
adminApiKey:
  secret: "" # default: <release>-gateway-admin
  key: adminApiKey

# Supervisor mTLS workload listener (HOR-398). Default OFF; an overlay opts in
# when AgentPool workers (SPIFFE leaves from the shared platform workflow CA)
# must reach the private model path at <port>/v1/chat/completions. Requires a
# serving leaf signed by the same CA + that CA mounted as the client CA.
workload:
  enabled: false
  port: 8443
  servicePort: 8443
  trustDomain: iterabase.local
  # The serving leaf: rendered as a cert-manager Certificate referencing the
  # platform workflow CA (issuer below). Secret holds tls.crt/tls.key.
  tlsSecretName: "" # default: <release>-gateway-workload-tls
  issuer:
    name: platform-spiffe-ca   # ClusterIssuer backing AgentPool worker leaves
    kind: ClusterIssuer
  # The platform workflow CA cert worker leaves are chained to (client CA).
  # Default: <release>-control-plane-gateway-ca (the secret backing the issuer).
  clientCASecretName: "" # default: <release>-control-plane-gateway-ca
  clientCAKey: ca.crt
  certMountPath: /etc/iterabase/workload/tls
  clientCAMountPath: /etc/iterabase/workload/ca

# Central Iterabase inference gateway (HOR-661, DES-HOR-661-03). When enabled,
# ModelBackends of kind `managed` route to central over mTLS with this
# installation's client certificate; external/vLLM/SGLang stay direct. A
# `managed` model with central disabled fails closed (upstream_unavailable).
central:
  enabled: false
  url: "" # required when enabled, e.g. https://central.iterabase.com
  # kubernetes.io/tls Secret holding the installation key and certificate
  # (tls.key/tls.crt), issued by `forge central issue`. Required when enabled.
  tlsSecretName: ""
  # PEM of the Iterabase central CA (public). Required when enabled; rendered
  # into a ConfigMap and used to verify central's serving certificate.
  caBundle: ""
  certMountPath: /etc/iterabase/central/tls
  caMountPath: /etc/iterabase/central/ca

# Reviewed single-node sizing (HOR-602, charts/docs/sizing.md): CPU request,
# memory request and memory limit; no CPU limit (CPU is compressible).
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

# Metrics (opt-in; flip on with observability — see values-observability.yaml).
# A dedicated plaintext in-cluster listener keeps telemetry off both the public
# API ingress and supervisor mTLS listener.
metrics:
  enabled: false
  port: 9090
  # scrapeInterval: 30s
