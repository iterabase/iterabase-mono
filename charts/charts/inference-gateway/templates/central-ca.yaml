{{- if and .Values.enabled .Values.central.enabled }}
# HOR-661: the public Iterabase central CA. The installation gateway verifies
# central's serving certificate against it (DES-HOR-661-02/03).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "inference-gateway.centralCAConfigMapName" . }}
  labels:
    {{- include "inference-gateway.labels" . | nindent 4 }}
data:
  ca.crt: |
    {{- .Values.central.caBundle | trim | nindent 4 }}
{{- end }}
