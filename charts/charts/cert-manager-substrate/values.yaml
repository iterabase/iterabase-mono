# The same complete values files used for the platform release are passed to
# this ordered companion. When internal TLS is enabled, its post-install gate
# creates or verifies the platform-owned internal CA before dependent platform
# workloads start. platformRelease is set explicitly by
# Forge and otherwise derives from the conventional <platform>-cert-manager
# release name used by direct operators.
#
# HOR-528: global.internalTLS.ca is the single internal-CA identity contract.
# This companion creates the root/issuers only when they do not exist and then
# verifies them; the platform chart reads the same values and is the only writer
# of an existing root. A per-chart override would make cert-manager re-issue
# (rotate) the authority while workloads still hold leaves signed by the
# previous key.
global:
  internalTLS:
    enabled: false
    platformRelease: ""
    issuerName: internal-ca
    ca:
      commonName: iterabase-internal-ca
      duration: 87600h

internalCABootstrap:
  image:
    repository: docker.io/alpine/k8s
    tag: 1.34.1
    digest: sha256:ec714df3813b5405292860f8a1c55c5727bf8c33c88992f1e981efad8065547f
    pullPolicy: IfNotPresent

cert-manager:
  enabled: true
  image:
    digest: sha256:e370f7800a53078e9d74324287a7d52b553864e55f5b4e521f911c3f6c7da203
  webhook:
    image:
      digest: sha256:c33cca307541e2d58861a55b1af5f390b7e19c8741e48b433693b73a7cce88b3
  cainjector:
    image:
      digest: sha256:ad1dcc5b2fccc420f9b3fbee7ce8a869450c540fd4f2f41de2d95b1ca0c4d701
  acmesolver:
    image:
      digest: sha256:33ebbc2688578e37bd48dcc5b6b1f1362c919dff44fe5e5f602532a2d37d514f
  startupapicheck:
    image:
      digest: sha256:68b3c5029dc63e64a6b6435337d7dc0eb169f889a48a02d999d1f22f31865b33
  crds:
    enabled: true
    keep: true
  prometheus:
    enabled: true
    # The platform observability chart owns the cross-release ServiceMonitor so
    # this substrate can be installed before Prometheus Operator CRDs exist.
    servicemonitor:
      enabled: false

cert-manager-csi-driver:
