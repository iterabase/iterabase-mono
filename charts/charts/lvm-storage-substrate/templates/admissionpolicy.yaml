{{- if not (index .Values "lvm-localpv" "enabled") }}{{ fail "lvm-localpv.enabled must remain true" }}{{- end }}
{{- if not (index .Values "agentpool" "authorizedManagerIdentity") }}{{ fail "agentpool.authorizedManagerIdentity must name the control-plane manager service-account username (fail closed); it is set by Forge on install" }}{{- end }}
# DES-HOR-545-01 / DES-HOR-545-07: only the control-plane manager may claim
# and grow the AgentPool workspace class. The resulting PVC must be
# controller-owned by exactly one platform.iterabase.com AgentPool. The policy
# is operation-aware so the agreed security invariant holds on CREATE/UPDATE:
#
#  * CREATE  - the request must arrive under the exact control-plane manager
#    ServiceAccount identity (request.userInfo.username) AND describe exactly one
#    controller ownerReference to platform.iterabase.com/v1alpha1 AgentPool. An
#    ownerReference alone can be forged by any client (it is client-set metadata),
#    so both must hold.
#  * UPDATE  - class, access mode, volume mode, and AgentPool controller
#    ownership remain immutable. Only the exact manager identity may change the
#    storage request, and only to a strictly larger quantity. Scheduler, CSI,
#    and kubelet updates that leave these protected fields untouched remain
#    allowed regardless of identity.
#
# The policy denies on missing/mismatched identity (failurePolicy Fail,
# validationActions Deny). Only PVCs selecting iterabase-agentpool-lvm-xfs are
# evaluated (matchConditions), regardless of namespace: the StorageClass and the
# manager watch are cluster-wide and the underlying PVs are literal whole-disk
# LVM, so REQ-035 ("no unrelated claim may use the AgentPool class") must hold in
# every namespace, not just the release namespace. The binding therefore applies
# cluster-wide; all other PVCs are unaffected.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: iterabase-agentpool-claim-authority
  annotations:
    iterabase.com/architecture-decision: DES-HOR-545-01,DES-HOR-545-07
    iterabase.com/claim-authority: agentpool-only
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["persistentvolumeclaims"]
  matchConditions:
    - name: selects-agentpool-class
      expression: "object.spec.storageClassName == 'iterabase-agentpool-lvm-xfs'"
  validations:
    # CREATE: exact manager identity (ownership alone is forgeable).
    - expression: "request.operation != 'CREATE' || request.userInfo.username == '{{ .Values.agentpool.authorizedManagerIdentity }}'"
      message: "Only the control-plane manager may create PVCs in the iterabase-agentpool-lvm-xfs class"
    # CREATE: exactly one controller ownerReference to platform.iterabase.com AgentPool.
    - expression: "request.operation != 'CREATE' || (has(object.metadata.ownerReferences) && size(object.metadata.ownerReferences.filter(r, has(r.controller) && r.controller == true && r.apiVersion == 'platform.iterabase.com/v1alpha1' && r.kind == 'AgentPool')) == 1)"
      message: "PVCs in the iterabase-agentpool-lvm-xfs class must be controller-owned by exactly one platform.iterabase.com/AgentPool"
    # UPDATE: the class is immutable once the PVC exists.
    - expression: "request.operation != 'UPDATE' || (has(oldObject.spec) && has(object.spec) && object.spec.storageClassName == oldObject.spec.storageClassName)"
      message: "The storageClassName of a PVC in the iterabase-agentpool-lvm-xfs class is immutable"
    - expression: "request.operation != 'UPDATE' || (object.spec.accessModes == oldObject.spec.accessModes && object.spec.volumeMode == oldObject.spec.volumeMode)"
      message: "The accessModes and volumeMode of a PVC in the iterabase-agentpool-lvm-xfs class are immutable"
    - expression: "request.operation != 'UPDATE' || object.spec.resources.requests.storage == oldObject.spec.resources.requests.storage || request.userInfo.username == '{{ .Values.agentpool.authorizedManagerIdentity }}'"
      message: "Only the control-plane manager may change an AgentPool PVC storage request"
    - expression: "request.operation != 'UPDATE' || object.spec.resources.requests.storage == oldObject.spec.resources.requests.storage || quantity(object.spec.resources.requests.storage).isGreaterThan(quantity(oldObject.spec.resources.requests.storage))"
      message: "An AgentPool PVC storage request may only increase"
    - expression: "request.operation != 'UPDATE' || (((!has(object.metadata.annotations) || !('platform.iterabase.com/resize-requested-at' in object.metadata.annotations)) && (!has(oldObject.metadata.annotations) || !('platform.iterabase.com/resize-requested-at' in oldObject.metadata.annotations))) || (has(object.metadata.annotations) && has(oldObject.metadata.annotations) && 'platform.iterabase.com/resize-requested-at' in object.metadata.annotations && 'platform.iterabase.com/resize-requested-at' in oldObject.metadata.annotations && object.metadata.annotations['platform.iterabase.com/resize-requested-at'] == oldObject.metadata.annotations['platform.iterabase.com/resize-requested-at']) || request.userInfo.username == '{{ .Values.agentpool.authorizedManagerIdentity }}')"
      message: "Only the control-plane manager may change AgentPool resize observation evidence"
    - expression: "request.operation != 'UPDATE' || (((!has(object.metadata.annotations) || !('platform.iterabase.com/resize-baseline-capacity-bytes' in object.metadata.annotations)) && (!has(oldObject.metadata.annotations) || !('platform.iterabase.com/resize-baseline-capacity-bytes' in oldObject.metadata.annotations))) || (has(object.metadata.annotations) && has(oldObject.metadata.annotations) && 'platform.iterabase.com/resize-baseline-capacity-bytes' in object.metadata.annotations && 'platform.iterabase.com/resize-baseline-capacity-bytes' in oldObject.metadata.annotations && object.metadata.annotations['platform.iterabase.com/resize-baseline-capacity-bytes'] == oldObject.metadata.annotations['platform.iterabase.com/resize-baseline-capacity-bytes']) || request.userInfo.username == '{{ .Values.agentpool.authorizedManagerIdentity }}')"
      message: "Only the control-plane manager may change AgentPool resize capacity evidence"
    # UPDATE: the AgentPool controller ownership is immutable; removing,
    # replacing, or swapping the ownerReference to a different AgentPool (even at
    # the same count with a different {name,uid}) is denied, while
    # scheduler/CSI/kubelet updates that never touch ownership pass untouched.
    - expression: "request.operation != 'UPDATE' || (size(object.metadata.ownerReferences.filter(r, has(r.controller) && r.controller == true && r.apiVersion == 'platform.iterabase.com/v1alpha1' && r.kind == 'AgentPool')) == 1 && size(oldObject.metadata.ownerReferences.filter(r, has(r.controller) && r.controller == true && r.apiVersion == 'platform.iterabase.com/v1alpha1' && r.kind == 'AgentPool')) == 1 && object.metadata.ownerReferences.filter(r, r.controller == true && r.apiVersion == 'platform.iterabase.com/v1alpha1' && r.kind == 'AgentPool')[0].name == oldObject.metadata.ownerReferences.filter(r, r.controller == true && r.apiVersion == 'platform.iterabase.com/v1alpha1' && r.kind == 'AgentPool')[0].name && object.metadata.ownerReferences.filter(r, r.controller == true && r.apiVersion == 'platform.iterabase.com/v1alpha1' && r.kind == 'AgentPool')[0].uid == oldObject.metadata.ownerReferences.filter(r, r.controller == true && r.apiVersion == 'platform.iterabase.com/v1alpha1' && r.kind == 'AgentPool')[0].uid)"
      message: "The AgentPool controller ownership of a PVC in the iterabase-agentpool-lvm-xfs class is immutable"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: iterabase-agentpool-claim-authority
  annotations:
    iterabase.com/architecture-decision: DES-HOR-545-01,DES-HOR-545-07
spec:
  policyName: iterabase-agentpool-claim-authority
  validationActions: [Deny]
  matchResources:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["persistentvolumeclaims"]
---
{{- $sig := .Values.signatures.authorizedClaim }}
{{- if or (not $sig.namespace) (not $sig.name) }}{{ fail "signatures.authorizedClaim.namespace and .name must name the artifact signature PVC (fail closed)" }}{{- end }}
# DES-HOR-461-05: the shared signature class admits exactly one claim, the
# platform's artifact signature PVC, in every namespace. Its class, access
# mode, and volume mode are immutable; capacity may only grow.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: iterabase-signatures-claim-authority
  annotations:
    iterabase.com/architecture-decision: DES-HOR-461-05
    iterabase.com/claim-authority: artifact-signatures-only
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["persistentvolumeclaims"]
  matchConditions:
    - name: selects-signatures-class
      expression: "object.spec.storageClassName == 'iterabase-signatures-lvm-xfs'"
  validations:
    - expression: "object.metadata.namespace == '{{ $sig.namespace }}' && object.metadata.name == '{{ $sig.name }}'"
      message: "Only the artifact signature PVC {{ $sig.namespace }}/{{ $sig.name }} may use the iterabase-signatures-lvm-xfs class"
    - expression: "object.spec.accessModes == ['ReadWriteOnce'] && (!has(object.spec.volumeMode) || object.spec.volumeMode == 'Filesystem')"
      message: "The artifact signature PVC must be a ReadWriteOnce filesystem claim"
    - expression: "request.operation != 'UPDATE' || (object.spec.storageClassName == oldObject.spec.storageClassName && object.spec.accessModes == oldObject.spec.accessModes)"
      message: "The class and access mode of the artifact signature PVC are immutable"
    - expression: "request.operation != 'UPDATE' || object.spec.resources.requests.storage == oldObject.spec.resources.requests.storage || quantity(object.spec.resources.requests.storage).isGreaterThan(quantity(oldObject.spec.resources.requests.storage))"
      message: "The artifact signature PVC storage request may only increase"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: iterabase-signatures-claim-authority
  annotations:
    iterabase.com/architecture-decision: DES-HOR-461-05
spec:
  policyName: iterabase-signatures-claim-authority
  validationActions: [Deny]
  matchResources:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["persistentvolumeclaims"]
---
# DES-HOR-545-05: OpenEBS 1.10.0 requires the LVMSnapshot schema and
# list/watch-only driver access for its ordinary volume-deletion safety check.
# The provider resource is inert: no caller may create an instance, and
# readiness separately requires the cluster-wide instance set to remain empty.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: iterabase-lvmsnapshot-create-deny
  annotations:
    iterabase.com/architecture-decision: DES-HOR-545-05
    iterabase.com/snapshot-boundary: inert-provider-schema
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["local.openebs.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE"]
        resources: ["lvmsnapshots"]
  validations:
    - expression: "false"
      message: "LVMSnapshot creation is disabled by DES-HOR-545-05"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: iterabase-lvmsnapshot-create-deny
  annotations:
    iterabase.com/architecture-decision: DES-HOR-545-05
spec:
  policyName: iterabase-lvmsnapshot-create-deny
  validationActions: [Deny]
