# DES-HOR-545-01 / DES-HOR-545-05: fixed OpenEBS LVM LocalPV 1.10.0
# substrate for K3s. These values are release-owned, not an overlay-selectable
# storage backend. The derived dependency retains only the inert LVMSnapshot CRD
# and node-driver list/watch required by upstream; the wrapper owns the matching
# controller permission and deny-all creation policy.
#
# agentpool.authorizedManagerIdentity is set by Forge on install (and by the
# E2E harness) to the exact userInfo.username of the control-plane manager
# (system:serviceaccount:<ns>:<platform-release>-control-plane-manager). It is
# deliberately required with an empty default so the chart fails closed rather
# than emitting a broken admission gate.
agentpool:
  authorizedManagerIdentity: ""
# DES-HOR-461-05: the only claim admitted to iterabase-signatures-lvm-xfs, the
# platform release's artifact signature PVC
# (<platform-release>-control-plane-artifact-signatures in its namespace).
signatures:
  authorizedClaim:
    namespace: iterabase-system
    name: iterabase-control-plane-artifact-signatures
lvm-localpv:
  enabled: true
  global:
    analytics:
      enabled: false
    kubeletDir: /var/lib/kubelet
  analytics:
    enabled: false
  storageCapacity: true
  crds:
    lvmLocalPv:
      enabled: true
      keep: true
  lvmNode:
    kubeletDir: /var/lib/kubelet
    # Applied to every node-plugin container (registrar + plugin).
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
    driverRegistrar:
      image:
        registry: ""
        repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
        tag: v2.13.0@sha256:d7138bcc3aa5f267403d45ad4292c95397e421ea17a0035888850f424c7de25d
  serviceAccount:
    lvmController:
      # The parent chart owns exact volume-lifecycle controller RBAC, including
      # the sole inert LVMSnapshot list/watch exception. The reviewed dependency
      # is deterministically stripped of CSI/user snapshot surfaces and write
      # authority before packaging, and its combined controller RBAC is disabled.
      create: false
      name: openebs-lvm-controller-sa
  lvmController:
    replicas: 1
    # Applied to every controller container (resizer, provisioner, plugin).
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
    resizer:
      image:
        registry: ""
        repository: registry.k8s.io/sig-storage/csi-resizer
        tag: v2.0.0@sha256:4a95d94e57ad82f6977cd8d4fdcfcfc0b83f02d990e4e7715b688c20970a906d
    provisioner:
      image:
        registry: ""
        repository: registry.k8s.io/sig-storage/csi-provisioner
        tag: v6.1.0@sha256:e5900dc98b0d02f317ea9572f3824983c47a2fb5d5fe2b160aedf1b99c14c9e4
  lvmPlugin:
    image:
      registry: ""
      repository: docker.io/openebs/lvm-driver
      tag: 1.10.0@sha256:b5932b4df5cde1f72914f665a4e4b480afd38dbc6577d7552b9f509d52e8c094
    metricsPort: 9500
    allowedTopologies: "kubernetes.io/hostname,"
