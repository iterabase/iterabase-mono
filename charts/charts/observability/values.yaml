enabled: true

# Internal TLS: when global.internalTLS is on, the chart renders stack-
# component leaf Certificates (stack-internal-tls.yaml) signed by this issuer
# (the cert-issuers internal CA ClusterIssuer), and values-tls.yaml configures
# the upstream charts to serve HTTPS + the Grafana datasources switch to https.
tls:
  issuerName: internal-ca

# Platform-owned rule policy. Invariant correctness/availability alerts ship
# enabled; workload-dependent performance alerts require explicit overlay
# thresholds because model, GPU, workflow, and customer workloads differ.
alerts:
  enabled: true
  # Prometheus `up == 0` cannot detect a target whose Pod, Service endpoint, or
  # monitor disappeared completely. These are the processes expected from the
  # default full-platform install; disable entries for intentionally omitted
  # components. Operator-created harness/model-backend targets become expected
  # only when an overlay enables those workloads.
  expectedTargets:
    controlPlaneAPI: {enabled: true, job: control-plane, component: api}
    controlPlaneManager: {enabled: true, job: control-plane, component: manager}
    toolGateway: {enabled: true, job: control-plane, component: gateway}
    dispatch: {enabled: true, job: control-plane, component: dispatch}
    toolMaterializer: {enabled: true, job: control-plane, component: tool-materializer}
    toolRunner: {enabled: true, job: control-plane, component: tool-runner}
    inferenceGateway: {enabled: true, job: inference-gateway, component: inference-gateway}
    postgresql: {enabled: true, job: postgresql, component: postgresql}
    redis: {enabled: true, job: redis, component: redis}
    minio: {enabled: true, job: minio, component: minio}
    harness: {enabled: false, job: control-plane, component: harness}
    modelBackend: {enabled: false, job: control-plane, component: model-backend}
  performance:
    apiP95Seconds: 0
    inferenceP95Seconds: 0
    inferenceTTFTP95Seconds: 0
    harnessTurnP95Seconds: 0
    modelQueueDepth: 0
    gpuUtilizationPercent: 0

# Cross-release scrape contract for the companion cert-manager substrate. The
# release defaults to <platform-release>-cert-manager in the same namespace.
certManager:
  metrics:
    enabled: true
  releaseName: ""

# --- Prometheus / Grafana / Alertmanager (kube-prometheus-stack) ---
# The stack is configured here as the platform default: PV-backed Prometheus +
# Alertmanager + Grafana, the operator's CRDs, node-exporter + kube-state-metrics
# (infrastructure/cluster metrics for free), and the kubernetes-mixin default
# rules. Prometheus discovers ALL ServiceMonitors / PodMonitors / PrometheusRules
# cluster-wide (nil selectors) so the per-component ServiceMonitors owned by the
# other iterabase subcharts (postgresql/redis/minio/inference-gateway/control-
# plane) and the upstream charts' own ServiceMonitors are picked up regardless of
# label. Alertmanager email routing is NOT baked in — it is overlay-owned
# (HOR-408: OPO1 overlay carries the email receiver config via
# observability.kube-prometheus-stack.alertmanager.config).
kube-prometheus-stack:
  enabled: true
  prometheusOperator:
    image:
      sha: a001ed10a3823bbf2410ea347796d0e35ff8decd24fb98acbe7ab9e98d431c39
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
    # config-reloader sidecar the operator injects into Prometheus/Alertmanager.
    prometheusConfigReloader:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
    admissionWebhooks:
      patch:
        image:
          sha: d0e80b2f62fe43bb5e1b96adc692132fb4522e802f4cf673c09b1f94722b8cb6
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
  kube-state-metrics:
    image:
      sha: sha256:85108987d044b18a098126732f98602df408888c0f7d456241f5abefb9744bc1
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
  prometheus-node-exporter:
    image:
      digest: sha256:8c9bac11973b94b59be88d6e11fee4429aa743c8846cdc75d65b18db33f6a106
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

  # kubernetes-mixin default rules (node/etcd/apiserver/pod/...). These plus the
  # iterabase-specific PrometheusRule (templates/iterabase-alerts.yaml) make up
  # the shipped "default prod alert rules".
  defaultRules:
    create: true

  # --- Alertmanager (PV-backed) ---
  alertmanager:
    enabled: true
    alertmanagerSpec:
      image:
        sha: 9e082985f56f4c8c9f724e18f2288c6708f472e56a5286b8863d080434ea065d
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: iterabase-lvm-xfs
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 5Gi
    # config is left at the chart default (routes everything to a `null`
    # receiver). The overlay sets alertmanager.config with the real receiver(s)
    # — email for OPO1 (HOR-408), other destinations deferred (non-goal).

  # --- Grafana (PV-backed; Loki datasource wired via the sidecar ConfigMap) ---
  grafana:
    enabled: true
    image:
      sha: 7cb8c64c4d57a57e734073f3cc94620adb24a0acb929bd80ba9f14017e3a975b
    resources:
      requests:
        cpu: 25m
        memory: 192Mi
      limits:
        memory: 512Mi
    initChownData:
      image:
        sha: dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
    persistence:
      enabled: true
      type: sts
      accessModes: ["ReadWriteOnce"]
      size: 5Gi
      storageClassName: iterabase-lvm-xfs
    # The datasource sidecar (enabled by default, label grafana_datasource=1)
    # loads the Loki datasource rendered by this chart
    # (templates/grafana-datasource-loki.yaml) alongside the stack's Prometheus
    # datasource. No public ingress by default — reach Grafana via port-forward
    # (kind/E2E) or flip grafana.ingress in the overlay for prod.
    ingress:
      enabled: false
    # Curated folder policy: upstream kube-prometheus-stack dashboards are
    # placed under Kubernetes; Iterabase ConfigMaps carry grafana_folder
    # annotations and are provisioned under Iterabase. Provisioned dashboards
    # are immutable in the UI so Git remains authoritative.
    sidecar:
      image:
        sha: 21b9fe7bb29d65caf2445ccbf96ff6eda5e589a92bd8f5188f957fe75b551d72
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 192Mi
      dashboards:
        folderAnnotation: grafana_folder
        defaultFolderName: Kubernetes
        annotations:
          grafana_folder: Kubernetes
        provider:
          allowUiUpdates: false
          foldersFromFilesStructure: true

  # --- Prometheus (PV-backed; discovers all monitors/rules cluster-wide) ---
  prometheus:
    enabled: true
    prometheusSpec:
      image:
        sha: 64f71bb84e03c855948418b0fc5dea53e9543d8e3fc9931598f583805507f05e
      resources:
        requests:
          cpu: 100m
          memory: 1Gi
        limits:
          memory: 2Gi
      replicas: 1
      retention: 15d
      # retentionSize is an absolute byte cap (the Prometheus Operator CRD
      # requires a byte-size value, not a percentage); 18GB ~ 90% of the 20Gi PV.
      retentionSize: 18GB
      # Nil selectors => Prometheus selects every ServiceMonitor / PodMonitor /
      # PrometheusRule in the cluster, so per-component monitors (owned by the
      # other iterabase subcharts) and the upstream charts' native monitors are
      # all discovered without label-matching plumbing.
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: iterabase-lvm-xfs
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 20Gi

# --- Loki (single-binary, filesystem PV) ---
# SingleBinary + filesystem storage = PV-backed persistence across pod restarts
# (HOR-408 acceptance). SimpleScalable/Distributed REQUIRE object storage, which
# is a non-goal here; the overlay may switch to MinIO by overriding
# deploymentMode + loki.loki.storage.type. retention/compactor tuning is deferred
# (non-goal: long-term retention tuning beyond PV-backed storage).
loki:
  enabled: true
  lokiCanary:
    image:
      digest: sha256:bc8c1cdd09266b56a83918524b115ae648028b40097534932e6ac1c0e1b1f7dc
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
  # The upstream `helm test` Pod exposes no resources value and no install path
  # runs `helm test`; keep it unrendered so every shipped container is sized
  # (HOR-602, scripts/check-resource-limits.sh).
  test:
    enabled: false
    image:
      digest: sha256:2ed6447bbdbcd23019c3fdb02bce6db3fbef296d5a8f77a68d3dbc386bfa43fb
  gateway:
    image:
      digest: sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
    deploymentStrategy:
      type: Recreate
      rollingUpdate: null
  sidecar:
    image:
      sha: a6b3f707f883108376514489a94d6629109a327b2978e1d826cd104c4ca436df
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 192Mi
  deploymentMode: SingleBinary
  loki:
    image:
      digest: sha256:9db961170b729dc38277963cbb4a79941626388562cc455db61bf85564aa8945
    # Single-tenant mode for the in-cluster platform install: promtail/Alloy
    # push without an X-Scope-OrgID header. The loki chart defaults
    # auth_enabled=true (multi-tenant), which 401-rejects every promtail push
    # ("no org id") so NO workload logs reach Loki. Flip to false for the
    # single-tenant platform default; a multi-tenant overlay can re-enable.
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    # A real Loki install requires a schemaConfig (the chart ships none). TSDB
    # store + v13 schema with filesystem object store for the single-binary PV
    # path. If the overlay switches to object storage (MinIO/s3), override
    # object_store + loki.loki.storage.type together.
    schemaConfig:
      configs:
        - from: 2024-04-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
  # The default gateway is a single replica with required same-component pod
  # anti-affinity. RollingUpdate deadlocks on a one-node cluster because the
  # replacement cannot schedule beside its predecessor. Recreate preserves the
  # isolation rule and accepts a brief gateway interruption during rollout.
  # HA/object-storage overlays may explicitly restore RollingUpdate when their
  # replica and topology contract can satisfy it (DES-HOR-506-01).
  # SimpleScalable targets default to 3 replicas each; zero them for
  # SingleBinary mode (only singleBinary.replicas runs).
  write:
    replicas: 0
  read:
    replicas: 0
  backend:
    replicas: 0
  singleBinary:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        memory: 1536Mi
    persistence:
      enabled: true
      size: 10Gi
      storageClass: iterabase-lvm-xfs
  # SingleBinary + filesystem storage does not need the external memcached
  # chunks/results caches (they add 2+ memcached pods the kind install does not
  # need); disable them. An overlay switching to object storage / SimpleScalable
  # may re-enable them.
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false

# --- Promtail (pod log collection -> Loki) ---
# DaemonSet that tails every node's container logs (kubernetes_sd role=pod +
# the cri pipeline stage for containerd/kind) and pushes them to the in-chart
# Loki SingleBinary service, so control-plane, inference-gateway, vLLM, and
# dependency logs are collected, stored, and queryable in Grafana (HOR-408
# outcome: "logs are collected, stored, and routed"). The client URL is
# Helm-templated (the promtail chart tpl's config.clients) so it resolves to the
# release-scoped Loki service name in any install (umbrella release
# `iterabase-platform-loki`, kind CI release `iterabase-loki`, etc.). RBAC +
# ServiceAccount + the pod-discovery scrape config are the chart defaults.
promtail:
  enabled: true
  image:
    tag: 3.0.0@sha256:d3de3da9431cfbe74a6a94555050df5257f357e827be8e63f8998d509c37af8b
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      memory: 256Mi
  config:
    clients:
      - url: http://{{ .Release.Name }}-loki:3100/loki/api/v1/push

# --- NVIDIA DCGM (GPU metrics) scraping ---
# gpu-operator (deployed out-of-band as infra on GPU nodes) runs dcgm-exporter as
# a Service. We only scrape it — no DaemonSet of our own. Disabled by default;
# GPU/inference overlays enable it. The ServiceMonitor matches the exporter by
# label across any namespace (gpu-operator's install namespace varies), so it
# survives wherever gpu-operator lands.
dcgmExporter:
  enabled: false
  # Match the stable Service contract created by NVIDIA GPU Operator. Keep the
  # selector exact so unrelated metrics Services cannot enter the scrape pool;
  # override only when a supported operator installation renames this contract.
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      app: nvidia-dcgm-exporter
  port: gpu-metrics
  path: /metrics
