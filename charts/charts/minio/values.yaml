enabled: true

image:
  repository: ghcr.io/iterabase/iterabase-third-party/minio
  tag: RELEASE.2025-09-07T16-13-09Z
  digest: sha256:786c852164a4fab14fd194fdbe6b4ed6f34934fcf6e4556aa9368432081719e9
  pullPolicy: IfNotPresent

# Root credentials generated into a Secret on first install (stable via lookup).
persistence:
  size: 20Gi # fixed StorageClass is iterabase-lvm-xfs

# Artifact bucket with policy-separated byte zones (HOR-399, DES-HOR-460-02).
# The provisioning Job uses the MinIO root credential to create the bucket and
# one user per zone with the canonical policy in files/policies/:
#   ingest    — quarantine write only            (API + gateway)
#   serve     — cleared original/derived read     (API + gateway)
#   lifecycle — promote and purge every zone      (artifact coordinator only)
# It then revokes the legacy broad `artifact-service` credential and policy.
# The default Secret names are a cross-chart contract with the control-plane
# chart's artifact.credentialSecrets defaults.
artifactService:
  enabled: true
  bucket: iterabase-artifacts
  credentialSecrets:
    ingest: "" # default: <release>-minio-artifact-ingest
    serve: "" # default: <release>-minio-artifact-serve
    lifecycle: "" # default: <release>-minio-artifact-lifecycle
  mcImage:
    repository: ghcr.io/iterabase/iterabase-third-party/minio
    tag: RELEASE.2025-09-07T16-13-09Z
    digest: sha256:786c852164a4fab14fd194fdbe6b4ed6f34934fcf6e4556aa9368432081719e9
    pullPolicy: IfNotPresent

networkPolicy:
  enabled: true

# Reviewed single-node sizing (HOR-602, charts/docs/sizing.md): CPU request,
# memory request and memory limit; no CPU limit (CPU is compressible).
resources:
  requests:
    cpu: 25m
    memory: 256Mi
  limits:
    memory: 1Gi

# Metrics (opt-in; flip on with observability — see values-observability.yaml).
# MinIO exposes /minio/v2/metrics/cluster natively on the S3 port (no exporter
# needed). Enabling this sets MINIO_PROMETHEUS_AUTH_TYPE=public on the server
# (in-cluster scrape without S3 auth) and renders a ServiceMonitor. The
# ServiceMonitor is a Prometheus Operator CRD — rendered regardless but only
# reconciled when the operator (from the observability chart) is installed.
metrics:
  enabled: false
  # scrapeInterval: 30s
