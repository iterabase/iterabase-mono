{{- if and .Values.enabled .Values.artifactService.enabled }}
{{- /* One stable generated credential per byte zone (DES-HOR-460-02):
     ingest (quarantine write) and serve (cleared read) for the API/gateway,
     lifecycle (promotion and purge) for the artifact coordinator only. */ -}}
{{- $root := . }}
{{- range $i, $zone := list "ingest" "serve" "lifecycle" }}
{{- $name := include (printf "minio.artifact%sSecretName" (title $zone)) $root }}
{{- if $i }}
---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "minio.artifactLabels" $root | nindent 4 }}
    iterabase.com/artifact-zone: {{ $zone }}
type: Opaque
{{- $existing := lookup "v1" "Secret" $root.Release.Namespace $name }}
{{- if $existing }}
data:
{{- range $k, $v := $existing.data }}
  {{ $k }}: {{ $v }}
{{- end }}
{{- else }}
stringData:
  accessKey: {{ randAlphaNum 20 | quote }}
  secretKey: {{ randAlphaNum 40 | quote }}
{{- end }}
{{- end }}
{{- end }}
