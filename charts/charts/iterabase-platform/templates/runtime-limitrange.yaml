{{- /*
Release-namespace default requests for containers created at runtime without
declared resources: AgentPool workers and ModelBackend pods built by the
manager (HOR-602, DES-HOR-602-02 as amended). Requests only — no default
limit and no max/min — so an unsized vLLM backend is never capped and an n-1
rollback still fits the node while this object briefly outlives it.
*/ -}}
{{- if .Values.runtimeDefaults.enabled }}
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ .Release.Name }}-runtime-defaults
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: runtime-defaults
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  limits:
    - type: Container
      defaultRequest:
        {{- toYaml .Values.runtimeDefaults.defaultRequest | nindent 8 }}
{{- end }}
