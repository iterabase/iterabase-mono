apiVersion: v2
name: iterabase-platform
description: Iterabase platform umbrella chart — inference-gateway + control-plane + Postgres/Redis/MinIO + ingress-nginx + external-dns + observability.
type: application
version: 0.4.6
appVersion: "0.4.6"
dependencies:
  - name: redis
    version: 0.2.4
    repository: file://../redis
    condition: redis.enabled
  - name: minio
    version: 0.2.6
    repository: file://../minio
    condition: minio.enabled
  - name: inference-gateway
    version: 0.2.13
    repository: file://../inference-gateway
    condition: inference-gateway.enabled
  - name: control-plane
    version: 0.5.4
    repository: file://../control-plane
    condition: control-plane.enabled
  - name: ingress-nginx
    version: 4.15.1
    repository: https://kubernetes.github.io/ingress-nginx
    condition: ingress-nginx.enabled
  # Optional private ingress plane. The alias gives it release-distinct
  # resources while retaining the same reviewed upstream controller chart.
  - name: ingress-nginx
    alias: internal-ingress-nginx
    version: 4.15.1
    repository: https://kubernetes.github.io/ingress-nginx
    condition: internal-ingress-nginx.enabled
  - name: metallb
    version: 0.16.1
    repository: https://metallb.github.io/metallb
    condition: metallb.enabled
  - name: metallb-config
    version: 0.2.0
    repository: file://../metallb-config
    condition: metallb-config.enabled
  - name: cert-issuers
    version: 0.2.0
    repository: file://../cert-issuers
    condition: cert-issuers.enabled
  - name: external-dns
    version: 1.21.1
    repository: https://kubernetes-sigs.github.io/external-dns/
    condition: external-dns.enabled
  # Stakater Reloader: restarts TLS-serving workloads when cert-manager renews
  # their mounted cert Secret (HOR-371 internal TLS). Enabled alongside
  # internalTLS (see values-tls.yaml / the prod overlay); a no-op when no
  # workload carries a reloader.stakater.com annotation.
  - name: reloader
    version: 2.2.14
    repository: https://stakater.github.io/stakater-charts
    condition: reloader.enabled
  # Observability stack (HOR-408): Prometheus + Grafana + Loki + Alertmanager
  # (kube-prometheus-stack + loki), the Prometheus Operator CRDs
  # (ServiceMonitor / PrometheusRule), default alert rules, a Loki Grafana
  # datasource, and optional NVIDIA DCGM (GPU) scraping. Disabled by default —
  # kind/E2E stays lean; enable in the observability preset / prod overlay.
  # Enabling observability alone brings up the stack; flip each component's
  # metrics.enabled to wire its ServiceMonitor(s) / exporter (see
  # values-observability.yaml).
  - name: observability
    version: 0.1.8
    repository: file://../observability
    condition: observability.enabled
