# Class-isolated public/private ingress planes on MetalLB. The addresses are
# the default Kind network's representatives; the scenario replaces them with
# the observed Kind subnet at runtime without changing the rendered shape.
metallb:
  enabled: true
metallb-config:
  enabled: true
  addresses:
    - 172.18.255.200-172.18.255.250
  additionalPools:
    - name: internal
      addresses:
        - 172.18.255.180-172.18.255.190
      autoAssign: false
internal-ingress-nginx:
  enabled: true
  controller:
    service:
      annotations:
        metallb.io/address-pool: iterabase-internal
        metallb.io/loadBalancerIPs: 172.18.255.180
