# Inference Gateway — Example Configuration
#
# Copy this file to gateway.yaml or gateway.local.yaml and adjust values.
# Environment variables in ${...} syntax are expanded at load time.
# Environment variable overrides (DATABASE_URL, REDIS_URL, etc.) take precedence.

server:
  port: 8080
  read_timeout: 30s
  write_timeout: 300s       # Long timeout for streaming responses
  idle_timeout: 120s

# Dedicated plaintext in-cluster listener. Keep separate from API ingress and
# the supervisor mTLS workload listener.
metrics:
  enabled: false
  port: 9090

database:
  url: "${DATABASE_URL}"    # postgres://user:pass@host:5432/gateway?sslmode=disable
  max_open_conns: 25
  max_idle_conns: 10

redis:
  url: "${REDIS_URL}"            # redis://host:6379/0 (plaintext) or rediss://host:6379/0 (TLS)
  ca_file: "${REDIS_TLS_CA_FILE}"  # PEM CA cert to verify rediss:// (internal CA); empty for plaintext

auth:
  admin_key: "${ADMIN_API_KEY}"

# The snapshot cache is the gateway's in-memory view of control-plane state
# (catalog, workload capabilities, rate-limit limits). Refreshed on start, on
# LISTEN/NOTIFY (catalog_changed/permissions_changed), and on
# the poll fallback. Redis is used only for the rate-limit counters.
snapshot:
  refresh_interval: 30s     # Poll fallback (LISTEN/NOTIFY drives prompt updates)
  readiness_staleness: 60s  # /readyz is unhealthy if the snapshot is older than this

# Supervisor mTLS workload listener (HOR-398; ARCH-010/011). When enabled, a
# second HTTP/2 mTLS server accepts supervisor model callers whose SPIFFE
# workload identity + active durable turn context validate against
# control-plane state. The customer listener is unaffected (separate
# policy path). Disabled by default; enable only after the workload trust
# bundle (SPIFFE CA) and a gateway serving cert are materialized.
workload:
  enabled: false
  port: 8443
  trust_domain: "iterabase.local"
  server_cert_file: "${WORKLOAD_SERVER_CERT_FILE}"   # PEM serving cert
  server_key_file:  "${WORKLOAD_SERVER_KEY_FILE}"    # PEM serving key
  client_ca_file:   "${WORKLOAD_CLIENT_CA_FILE}"     # SPIFFE CA bundle (client cert trust)
  read_timeout:  30s
  write_timeout: 300s       # Long timeout for streaming responses
  idle_timeout:  120s

logging:
  level: info               # debug, info, warn, error
  format: json              # json or text
