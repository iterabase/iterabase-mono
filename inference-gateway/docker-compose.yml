services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://gateway:gateway@postgres:5432/gateway?sslmode=disable
      ADMIN_API_KEY: ${ADMIN_API_KEY:-admin-dev-key}
      LOG_FORMAT: text
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
