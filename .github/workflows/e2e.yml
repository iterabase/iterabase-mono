name: E2E

# Build once (C3), then run the selected scenarios (C2): Kind on GitHub-hosted
# runners and real-machine scenarios on fresh per-run EC2 hosts (C1). The merge
# queue selects strictly (DES-HOR-590-02). A push to master only builds, reusing
# the merge-queue images for the same commit; it runs no scenarios again.
on:
  pull_request:
  merge_group:
  push:
    branches: [master]
  workflow_call:
    inputs:
      all:
        description: Select everything (full validation)
        type: boolean
        default: false
      ref:
        description: Exact commit to validate (default the triggering ref)
        type: string
        default: ""
      release_targets:
        description: Validating a release; images of other targets come from their published versions (C7)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: e2e-${{ inputs.all && 'full-' || '' }}${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

env:
  GO_CACHE_DEPENDENCIES: |
    control-plane/go.sum
    inference-gateway/go.sum
    forge/go.sum
    forge/test/e2e/go.sum
    testkit/e2e/go.mod
    control-plane/test/e2e/go.mod
    charts/test/e2e/go.sum

jobs:
  select:
    name: select
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
      stages: ${{ steps.select.outputs.stages }}
      build: ${{ steps.plan.outputs.build }}
      kind: ${{ steps.plan.outputs.kind }}
      real: ${{ steps.plan.outputs.real }}
      capacities: ${{ steps.plan.outputs.capacities }}
      pr_scenarios: ${{ steps.escapes.outputs.pr_scenarios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - id: select
        uses: ./.github/actions/select
        with:
          all: ${{ inputs.all || false }}
      - name: Plan builds and scenario matrices
        id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          plan=$(python3 .github/scripts/e2e_inputs.py plan --selection "$RUNNER_TEMP/selection.json" \
            --catalogue "$RUNNER_TEMP/catalogue.json" --source-sha "$source_sha")
          if [[ "$EVENT" == push ]]; then
            # The merge queue already validated this exact commit.
            plan=$(jq -c '.kind = [] | .real = []' <<<"$plan")
          fi
          {
            echo "source_sha=$source_sha"
            echo "build=$(jq -c .build <<<"$plan")"
            echo "kind=$(jq -c .kind <<<"$plan")"
            echo "real=$(jq -c .real <<<"$plan")"
            echo "capacities=$(jq -c '[.real[].capacity] | unique' <<<"$plan")"
          } >> "$GITHUB_OUTPUT"
      - name: Record what pull-request selection would have run
        id: escapes
        if: github.event_name == 'merge_group'
        env:
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          # DES-HOR-590-02: a queue failure in a scenario this would have skipped
          # is a selection escape.
          python3 .github/scripts/affected.py --catalogue "$RUNNER_TEMP/catalogue.json" \
            --base "$QUEUE_BASE" --head "$QUEUE_HEAD" --output "$RUNNER_TEMP/selection-pr.json" > /dev/null
          echo "pr_scenarios=$(jq -c .scenarios "$RUNNER_TEMP/selection-pr.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-selection
          path: |
            ${{ runner.temp }}/selection.json
            ${{ runner.temp }}/catalogue.json

  build:
    name: build ${{ matrix.image }}
    needs: select
    if: needs.select.outputs.build != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.build) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/docker-hub-login
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Verify the exact source
        run: test "$(git rev-parse HEAD)" = '${{ needs.select.outputs.source_sha }}'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse an existing build of this commit
        id: existing
        run: |
          if docker buildx imagetools inspect '${{ matrix.repository }}:${{ matrix.tag }}' >/dev/null 2>&1; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "reusing \`${{ matrix.repository }}:${{ matrix.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.existing.outputs.reuse != 'true'
        uses: ./.github/actions/setup-buildx
      - name: Build and push ${{ matrix.image }} once
        if: steps.existing.outputs.reuse != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ matrix.repository }}:${{ matrix.tag }}
          build-args: |
            VERSION=${{ matrix.version }}
            COMMIT=${{ needs.select.outputs.source_sha }}
          labels: |
            org.opencontainers.image.version=${{ matrix.version }}
            org.opencontainers.image.revision=${{ needs.select.outputs.source_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=image-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.name }}

  images:
    name: resolve images
    needs: [select, build]
    if: needs.select.outputs.build != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      images: ${{ steps.resolve.outputs.images }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve every sha tag to its registry digest
        id: resolve
        env:
          BUILD: ${{ needs.select.outputs.build }}
        run: |
          set -euo pipefail
          images='{}'
          while IFS= read -r entry; do
            name=$(jq -r .name <<<"$entry"); repository=$(jq -r .repository <<<"$entry"); tag=$(jq -r .tag <<<"$entry")
            digest=$(docker buildx imagetools inspect "$repository:$tag" --format '{{json .Manifest}}' | jq -r .digest)
            images=$(jq -c --arg n "$name" --arg r "$repository" --arg t "$tag" --arg d "$digest" \
              '.[$n] = {repository: $r, tag: $t, digest: $d}' <<<"$images")
            echo "- \`$repository:$tag\` = \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
          done < <(jq -c '.[]' <<<"$BUILD")
          echo "images=$images" >> "$GITHUB_OUTPUT"

  kind:
    name: ${{ matrix.id }}
    needs: [select, images]
    if: needs.select.outputs.kind != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.kind) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/docker-hub-login
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-selection
          path: ${{ runner.temp }}/selection
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: e2e-${{ matrix.owner }}
      - uses: ./.github/actions/setup-kubernetes-tools
      - uses: ./.github/actions/cache-helm
        with:
          cache-scope: e2e
      - name: Add external chart repositories
        run: .github/scripts/add_helm_repositories.sh
      - if: matrix.id == 'control-plane/deployed-control-plane'
        uses: ./.github/actions/setup-node
        with:
          node-version: 24.19.0
          cache-dependency-path: control-plane/test/e2e/playwright/package-lock.json
          cache-scope: e2e-browser
      - if: matrix.id == 'control-plane/deployed-control-plane'
        uses: ./.github/actions/setup-playwright
        with: {version: 1.62.1}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare inputs from the build-once images
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGES: ${{ needs.images.outputs.images }}
        run: |
          python3 .github/scripts/e2e_inputs.py prepare --scenario '${{ matrix.id }}' \
            --catalogue "$RUNNER_TEMP/selection/catalogue.json" --images "$IMAGES" \
            --source-sha '${{ needs.select.outputs.source_sha }}' \
            --optional-stages '${{ needs.select.outputs.stages }}' --workdir "$RUNNER_TEMP/inputs" \
            --release-targets '${{ inputs.release_targets }}'
      - name: Run ${{ matrix.id }}
        env:
          E2E_SKIP_BUILD_DEPS: "true" # the inputs step built the chart dependencies once
          ITERABASE_E2E_DIAGNOSTICS: ${{ runner.temp }}/diagnostics
          # Kind nodes pull chart images with their own containerd (testkit
          # gives it these credentials); the runner's docker login does not.
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: make -C '${{ matrix.owner }}' '${{ matrix.make_target }}'
      - name: Keep the scenario's diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-${{ matrix.name }}
          path: ${{ runner.temp }}/diagnostics
          if-no-files-found: ignore
          retention-days: 14

  # Real-machine hosts boot from the AMI baked for this tree's pinned inputs; the
  # bake is a no-op when that generation exists (DES-HOR-590-03).
  bake:
    name: fixture images
    needs: select
    if: needs.select.outputs.real != '[]'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/bake.yml
    with:
      capacities: ${{ needs.select.outputs.capacities }}

  real-machine:
    name: ${{ matrix.id }}
    needs: [select, images, bake]
    if: needs.select.outputs.real != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
      id-token: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.real) }}
    env:
      FIXTURE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/docker-hub-login
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-selection
          path: ${{ runner.temp }}/selection
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: e2e-forge
      - uses: ./.github/actions/setup-kubernetes-tools
      - uses: ./.github/actions/cache-helm
        with:
          cache-scope: e2e
      - name: Add external chart repositories
        run: .github/scripts/add_helm_repositories.sh
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-aws-ci
        with:
          role-arn: ${{ vars.AWS_CI_ROLE_ARN }}
          region: ${{ vars.AWS_CI_REGION }}
          session-name: iterabase-e2e-${{ matrix.name }}-${{ github.run_id }}
      - name: Launch a fresh ${{ matrix.capacity }} host
        run: |
          python3 .github/scripts/aws_ci.py launch-fixture --region '${{ vars.AWS_CI_REGION }}' \
            --run-id "$FIXTURE_RUN_ID" --scenario '${{ matrix.name }}' --capacity '${{ matrix.capacity }}' \
            --max-age-minutes '${{ matrix.timeout }}'
      - name: Prepare inputs from the build-once images
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGES: ${{ needs.images.outputs.images }}
        run: |
          python3 .github/scripts/e2e_inputs.py prepare --scenario '${{ matrix.id }}' \
            --catalogue "$RUNNER_TEMP/selection/catalogue.json" --images "$IMAGES" \
            --source-sha '${{ needs.select.outputs.source_sha }}' \
            --optional-stages '${{ needs.select.outputs.stages }}' --workdir "$RUNNER_TEMP/inputs" \
            --release-targets '${{ inputs.release_targets }}'
      - name: Run ${{ matrix.id }}
        env:
          ITERABASE_E2E_DIAGNOSTICS: ${{ runner.temp }}/diagnostics
        run: make -C forge '${{ matrix.make_target }}'
      - name: Keep the scenario's diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-${{ matrix.name }}
          path: ${{ runner.temp }}/diagnostics
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove the host
        if: always()
        run: python3 .github/scripts/aws_ci.py cleanup-run --region '${{ vars.AWS_CI_REGION }}' --run-id "$FIXTURE_RUN_ID"

  # One live preview per pull request with deployable changes and one staging
  # environment on master (C6, C9, C12). Not a merge gate.
  preview:
    name: preview
    needs: [select, images]
    if: >-
      needs.select.outputs.build != '[]' && !inputs.all &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: preview-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'staging' }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
      packages: write
      deployments: write
    environment:
      name: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'staging' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      PREVIEW: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'staging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/docker-hub-login
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: forge/go.sum
          cache-scope: preview
      - uses: ./.github/actions/setup-kubernetes-tools
      - uses: ./.github/actions/cache-helm
        with:
          cache-scope: preview
      - name: Add external chart repositories
        run: .github/scripts/add_helm_repositories.sh
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log Helm in to the preview chart registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - uses: ./.github/actions/setup-aws-ci
        with:
          role-arn: ${{ vars.AWS_CI_ROLE_ARN }}
          region: ${{ vars.AWS_CI_REGION }}
          session-name: iterabase-preview-${{ github.run_id }}
      - name: Mint an ephemeral tag:preview tailnet key and create the preview's Tailscale Services
        env:
          TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TAILSCALE_OAUTH_SECRET: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
        run: |
          set -euo pipefail
          python3 .github/scripts/tailscale_services.py mint-host-key --output "$RUNNER_TEMP/tailscale-key"
          python3 .github/scripts/tailscale_services.py up --environment "$PREVIEW"
      - name: Install the repository preview SSH key
        env:
          PREVIEW_SSH_KEY: ${{ secrets.PREVIEW_SSH_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/preview_ed25519"
          printf '%s\n' "$PREVIEW_SSH_KEY" > "$RUNNER_TEMP/preview_ed25519"
      - name: Find or launch the ${{ env.PREVIEW }} host
        id: host
        run: |
          python3 .github/scripts/aws_ci.py preview-up --region '${{ vars.AWS_CI_REGION }}' --name "$PREVIEW" \
            --run-id '${{ github.run_id }}' --ssh-key "$RUNNER_TEMP/preview_ed25519" \
            --tailscale-auth-key-file "$RUNNER_TEMP/tailscale-key"
      - name: Deploy with this commit's Forge
        id: deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_LLM_API_KEY: ${{ secrets.PREVIEW_LLM_API_KEY }}
          IMAGES: ${{ needs.images.outputs.images }}
        run: |
          python3 .github/scripts/preview.py --name "$PREVIEW" --run-number '${{ github.run_number }}' \
            --source-sha '${{ needs.select.outputs.source_sha }}' --images "$IMAGES" \
            --address '${{ steps.host.outputs.address }}' --host-key '${{ steps.host.outputs.host_key }}' \
            --data-device '${{ steps.host.outputs.data_device }}' --created '${{ steps.host.outputs.created }}' \
            --ssh-key "$RUNNER_TEMP/preview_ed25519" \
            --llm-base-url '${{ vars.PREVIEW_LLM_BASE_URL }}' --model-id '${{ vars.PREVIEW_LLM_MODEL }}'
      - name: Summary
        run: |
          {
            echo "### Preview \`$PREVIEW\`"
            echo
            echo "- Dashboard and API (tailnet only): ${{ steps.deploy.outputs.url }}"
            echo "- OpenAI-compatible inference (tailnet only): ${{ steps.deploy.outputs.inference_url }}"
            echo "- chart \`${{ steps.deploy.outputs.chart_version }}\`, host \`${{ steps.host.outputs.instance_id }}\` (created: ${{ steps.host.outputs.created }}), deadline \`${{ steps.host.outputs.deadline }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  required:
    name: E2E / required
    if: always()
    needs: [select, build, images, kind, bake, real-machine]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require the selection and every job that had work
        env:
          NEEDS: ${{ toJSON(needs) }}
          BUILD: ${{ needs.select.outputs.build }}
          KIND: ${{ needs.select.outputs.kind }}
          REAL: ${{ needs.select.outputs.real }}
        run: |
          set -euo pipefail
          has() { if [[ -n "$1" && "$1" != "[]" ]]; then echo true; else echo false; fi; }
          expect() {  # job, had-work
            local result; result=$(jq -r --arg job "$1" '.[$job].result' <<<"$NEEDS")
            if [[ "$2" == true ]]; then
              [[ "$result" == success ]] || { echo "::error::$1 finished $result"; return 1; }
            else
              [[ "$result" == skipped ]] || { echo "::error::$1 had no work but finished $result"; return 1; }
            fi
            echo "$1: $result"
          }
          status=0
          expect select true || status=1
          expect build "$(has "$BUILD")" || status=1
          expect images "$(has "$BUILD")" || status=1
          expect kind "$(has "$KIND")" || status=1
          expect bake "$(has "$REAL")" || status=1
          expect real-machine "$(has "$REAL")" || status=1
          exit "$status"
      - name: Report selection escapes
        if: always() && github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_SCENARIOS: ${{ needs.select.outputs.pr_scenarios }}
        run: |
          set -euo pipefail
          failed=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure") | .name')
          escapes=$(jq -rn --argjson pr "${PR_SCENARIOS:-[]}" --arg failed "$failed" \
            '$failed | split("\n") | map(select(test("^[a-z0-9-]+/[a-z0-9-]+$") and (. as $id | $pr | index($id) | not))) | .[]')
          if [[ -n "$escapes" ]]; then
            {
              echo "### Selection escapes (DES-HOR-590-02)"
              echo
              echo "Failed in the merge queue but skipped by pull-request selection:"
              while IFS= read -r escape; do echo "- $escape"; done <<<"$escapes"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::selection escape: $(tr '\n' ' ' <<<"$escapes")"
          fi
