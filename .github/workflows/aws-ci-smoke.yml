# Dispatchable end-to-end proof of the `iterabase-ci` fixture account
# (DES-HOR-591-01, docs/runbooks/aws-ci.md). It launches real m6i.xlarge and
# g5.xlarge fixtures, proves the per-run pinned host key and EBS by-id device
# identity, proves instance-initiated-shutdown termination, and proves the
# denied launch cases fail closed with access-denied. The current
# Canonical Ubuntu 24.04 AMI is copied into the CI account for the run and
# removed again by the cleanup job.
#
# `workflow_dispatch` only: this workflow never runs on a pull request, a push,
# or a schedule, so no pull request can create AWS resources.
name: AWS CI smoke

on:
  workflow_dispatch:
    inputs:
      denied_instance_profile:
        description: Throwaway instance profile that the attached-profile denied case references
        required: false
        default: iterabase-ci-denied-profile
      source_ami_id:
        description: Optional Canonical Ubuntu 24.04 AMD64 source AMI override
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-ci-smoke
  cancel-in-progress: false

jobs:
  preflight:
    name: bootstrap AMI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      ami_id: ${{ steps.bootstrap.outputs.ami_id }}
      public_ami_id: ${{ steps.bootstrap.outputs.public_ami_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-aws-ci
        with:
          role-arn: ${{ vars.AWS_CI_ROLE_ARN }}
          region: ${{ vars.AWS_CI_REGION }}
          session-name: iterabase-ci-smoke-preflight-${{ github.run_id }}
      - name: Copy the tagged CI-owned bootstrap AMI
        id: bootstrap
        env:
          SOURCE_AMI_ID: ${{ inputs.source_ami_id }}
        run: |
          set -euo pipefail
          python3 .github/scripts/aws_ci.py bootstrap-ami \
            --region '${{ vars.AWS_CI_REGION }}' \
            --run-id '${{ github.run_id }}' \
            --source-ami-id "$SOURCE_AMI_ID"

  host:
    name: smoke ${{ matrix.capacity }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        capacity: [cpu, gpu]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-aws-ci
        with:
          role-arn: ${{ vars.AWS_CI_ROLE_ARN }}
          region: ${{ vars.AWS_CI_REGION }}
          session-name: iterabase-ci-smoke-${{ matrix.capacity }}-${{ github.run_id }}
      - name: Launch, prove, and terminate the ${{ matrix.capacity }} fixture
        run: |
          set -euo pipefail
          python3 .github/scripts/aws_ci.py run-host \
            --region '${{ vars.AWS_CI_REGION }}' \
            --run-id '${{ github.run_id }}' \
            --capacity '${{ matrix.capacity }}' \
            --ami-id '${{ needs.preflight.outputs.ami_id }}'

  denied:
    name: denied launches
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-aws-ci
        with:
          role-arn: ${{ vars.AWS_CI_ROLE_ARN }}
          region: ${{ vars.AWS_CI_REGION }}
          session-name: iterabase-ci-smoke-denied-${{ github.run_id }}
      - name: Prove the denied launch cases fail closed
        run: |
          set -euo pipefail
          python3 .github/scripts/aws_ci.py denied-cases \
            --region '${{ vars.AWS_CI_REGION }}' \
            --run-id '${{ github.run_id }}' \
            --ami-id '${{ needs.preflight.outputs.ami_id }}' \
            --public-ami-id '${{ needs.preflight.outputs.public_ami_id }}' \
            --instance-profile '${{ inputs.denied_instance_profile }}'

  cleanup:
    name: cleanup
    needs: [preflight, host, denied]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-aws-ci
        with:
          role-arn: ${{ vars.AWS_CI_ROLE_ARN }}
          region: ${{ vars.AWS_CI_REGION }}
          session-name: iterabase-ci-smoke-cleanup-${{ github.run_id }}
      - name: Remove every resource this run created
        run: |
          set -euo pipefail
          python3 .github/scripts/aws_ci.py cleanup-run \
            --region '${{ vars.AWS_CI_REGION }}' \
            --run-id '${{ github.run_id }}' \
            --ami-id '${{ needs.preflight.outputs.ami_id }}'
