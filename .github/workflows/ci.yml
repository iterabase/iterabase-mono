name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      all:
        description: Select everything (full validation)
        type: boolean
        default: false
      ref:
        description: Exact commit to validate (default the triggering ref)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.all && 'full-' || '' }}${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

env:
  TESTCONTAINERS_RYUK_CONTAINER_IMAGE: testcontainers/ryuk:0.14.0@sha256:7c1a8a9a47c780ed0f983770a662f80deb115d95cce3e2daa3d12115b8cd28f0
  GO_CACHE_DEPENDENCIES: |
    control-plane/go.sum
    inference-gateway/go.sum
    forge/go.sum
    forge/test/e2e/go.sum
    testkit/e2e/go.mod
    control-plane/test/e2e/go.mod
    charts/test/e2e/go.mod
    charts/test/e2e/go.sum
    .github/tools/go.sum
    .github/tools/control-plane/go.sum

jobs:
  # One deterministic affected-graph selection (C2) gates every job below.
  select:
    name: select
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.select.outputs.jobs }}
      classification: ${{ steps.select.outputs.classification }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - id: select
        uses: ./.github/actions/select
        with:
          all: ${{ inputs.all || false }}

  # CI, testkit and release-contract changes: the selector, release, remote
  # content, AWS substrate and shared E2E mechanics.
  ci-contract:
    name: ci-contract
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'ci-contract')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: shared-testkit
      - uses: ./.github/actions/setup-kubernetes-tools
      - name: Shared E2E mechanics and compiled catalogue
        run: make testkit-test
      - name: Selector, release, remote-content and AWS substrate contracts
        run: make release-check

  control-plane:
    name: control-plane
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'control-plane')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: control-plane
      - uses: ./.github/actions/setup-node
        with:
          node-version: 24.19.0
          cache-dependency-path: control-plane/ui/package-lock.json
          cache-scope: control-plane-build
      - name: Install repository-locked control-plane tools
        run: |
          .github/scripts/install_go_tool.sh golangci-lint
          .github/scripts/install_go_tool.sh controller-gen
      - name: Install checksummed envtest runtime
        uses: ./.github/actions/setup-ci-tool
        with: {name: envtest, version: 1.37.0}
      - name: Install Dashboard dependencies
        run: make ui-deps
        working-directory: control-plane
      - name: Formatting
        run: make fmt-check
        working-directory: control-plane
      - name: Lint
        run: make lint
        working-directory: control-plane
      - name: Build
        run: make build
        working-directory: control-plane
      - name: Unit, integration, and envtest
        run: make test
        working-directory: control-plane

  ui:
    name: dashboard
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'ui')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-node
        with:
          node-version: 24.19.0
          cache-dependency-path: control-plane/ui/package-lock.json
          cache-scope: dashboard
      - name: Install dependencies
        run: make ui-deps
        working-directory: control-plane
      - name: Typecheck
        run: make ui-lint
        working-directory: control-plane
      - name: Component, interaction, accessibility, and localization tests
        run: make ui-test
        working-directory: control-plane
      - name: Production build
        run: make ui-build
        working-directory: control-plane

  harness:
    name: harness
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'harness')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: harness
      - uses: ./.github/actions/setup-node
        with:
          node-version: 22.23.2
          cache-dependency-path: control-plane/harness/package-lock.json
          cache-scope: harness
      - name: Install dependencies
        run: make harness-deps
        working-directory: control-plane
      - name: Typecheck
        run: make harness-lint
        working-directory: control-plane
      - name: Unit and native transport integration tests
        run: make harness-test
        working-directory: control-plane
      - name: Required Linux process and UID isolation gate (no skip)
        run: make harness-isolation-test
        working-directory: control-plane

  tool-runner:
    name: tool-runner
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'tool-runner')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-node
        with:
          node-version: 24.19.0
          cache-dependency-path: control-plane/tool-runner/package-lock.json
          cache-scope: tool-runner
      - name: Install dependencies
        run: make tool-runner-deps
        working-directory: control-plane
      - name: Typecheck
        run: make tool-runner-lint
        working-directory: control-plane
      - name: Test
        run: make tool-runner-test
        working-directory: control-plane
      - name: Build
        run: make tool-runner-build
        working-directory: control-plane

  proto:
    name: protobuf
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'proto')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: protobuf
      - uses: ./.github/actions/setup-node
        with:
          node-version: 22.23.2
          cache-dependency-path: .github/tools/protobuf/package-lock.json
          cache-scope: protobuf-tools
      - name: Install repository-locked protobuf tools
        run: |
          .github/scripts/install_go_tool.sh buf
          .github/scripts/install_go_tool.sh protoc-gen-go
          .github/scripts/install_go_tool.sh protoc-gen-connect-go
          .github/scripts/install_node_tool.sh protoc-gen-es
      - name: Lint, regenerate, and verify committed stubs
        run: make proto-check
        working-directory: control-plane

  inference-gateway:
    name: inference-gateway
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'inference-gateway')
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.25.12
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: inference-gateway
      - name: Install pinned goimports
        run: .github/scripts/install_go_tool.sh goimports
      - name: Formatting and imports
        run: make fmt-check
        working-directory: inference-gateway
      - name: Vet
        run: go vet ./...
        working-directory: inference-gateway
      - name: Install pinned golangci-lint
        run: .github/scripts/install_go_tool.sh golangci-lint
      - name: Lint
        run: make lint
        working-directory: inference-gateway
      - name: Build
        run: make build
        working-directory: inference-gateway
      - name: Unit and testcontainers integration tests
        run: make test
        working-directory: inference-gateway

  forge:
    name: forge
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'forge')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: forge
      - name: Formatting
        run: make fmt-check
        working-directory: forge
      - name: Install pinned golangci-lint
        run: .github/scripts/install_go_tool.sh golangci-lint
      - name: Lint
        run: make lint
        working-directory: forge
      - name: Install checksummed GoReleaser
        uses: ./.github/actions/setup-ci-tool
        with: {name: goreleaser, version: 2.12.7}
      - name: GoReleaser configuration
        run: goreleaser check
        working-directory: forge
      - name: Build
        run: make build
        working-directory: forge
      - name: Unit and fake-SSH integration tests
        run: make test
        working-directory: forge

  # Founder-approved (HOR-545 Option B): a required, isolated, privileged job that
  # actually executes the real reconcile/purge transaction fault matrix over
  # loop-backed by-id devices. It runs as root with the internal
  # FORGE_FAULT_MATRIX_REQUIRED=1 flag, so it FAILS (never skips) if the LVM/root
  # prerequisites or any matrix stage are unavailable, and FAILS if any stage
  # misbehaves. The generated script only accepts loop devices when the internal
  # FORGE_DATA_STORAGE_FIXTURE_LOOP env is present (injected here); normal forge
  # apply never sets it and rejects loop devices unchanged.
  forge-fault-matrix:
    name: forge-fault-matrix
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'forge')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: forge
      - name: Install LVM toolchain for the privileged fault matrix
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lvm2 psmisc
      - name: Execute the executable fault-stage matrix (privileged, fail-closed)
        working-directory: forge
        run: |
          GOMODCACHE="$(go env GOMODCACHE)"
          sudo env "HOME=/tmp/forge-fx" "PATH=$PATH" "GOMODCACHE=$GOMODCACHE" \
            FORGE_FAULT_MATRIX_REQUIRED=1 go test -count=1 \
            -run 'TestDataStorageFaultStageMatrixExecutable|TestDataStorageReapplyReceiptMonotonicExecutable|TestDataStorageReapplyAfterKernelNameReorderExecutable|TestDataStoragePurgeFaultStageMatrixExecutable|TestDataStorageLoopDevicesRejectedWithoutFixtureFlag' \
            ./internal/sshprovisioner/

  charts:
    name: charts-static
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'charts')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-kubernetes-tools
      - uses: ./.github/actions/cache-helm
        with:
          cache-scope: charts-static
      - name: Add external chart repositories
        run: .github/scripts/add_helm_repositories.sh
      - name: Lint, template, kubeconform, and chart contracts
        run: make check
        working-directory: charts
      - name: Internal TLS static contracts
        run: make check-tls
        working-directory: charts

  # Shared Go E2E modules are compiled and tested by several owners but are not
  # linted by any of their product jobs. This dedicated job installs the
  # repository-pinned golangci-lint and runs it in every nested module, so a
  # required aggregate cannot pass while the canonical local lint matrix fails.
  # `.github/ci/go-lint-owners.json` names this job as the PR and candidate lint
  # owner for all four modules; `.github/scripts/test_lint_parity.py` fails when
  # that ownership or this wiring drifts.
  nested-go-lint:
    name: nested-go-lint
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'e2e-modules')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: nested-go-lint
      - name: Install pinned golangci-lint
        run: .github/scripts/install_go_tool.sh golangci-lint
      - name: Lint charts/test/e2e
        working-directory: charts/test/e2e
        run: golangci-lint run ./...
      - name: Lint control-plane/test/e2e
        working-directory: control-plane/test/e2e
        run: golangci-lint run ./...
      - name: Lint forge/test/e2e
        working-directory: forge/test/e2e
        run: golangci-lint run ./...
      - name: Lint testkit/e2e
        working-directory: testkit/e2e
        run: golangci-lint run ./...

  required:
    name: CI / required
    if: always()
    needs:
      - select
      - ci-contract
      - control-plane
      - ui
      - harness
      - tool-runner
      - proto
      - inference-gateway
      - forge
      - forge-fault-matrix
      - charts
      - nested-go-lint
    runs-on: ubuntu-latest
    steps:
      - name: Require the selection and every selected job
        env:
          NEEDS: ${{ toJSON(needs) }}
          SELECTED: ${{ needs.select.outputs.jobs }}
        run: |
          set -euo pipefail
          test "$(jq -r .select.result <<<"$NEEDS")" = success || { echo "selection did not succeed"; exit 1; }
          # Job ids whose selector name differs; forge-fault-matrix follows forge.
          declare -A selector=([charts]=charts [nested-go-lint]=e2e-modules [forge-fault-matrix]=forge)
          status=0
          for job in $(jq -r 'keys[] | select(. != "select")' <<<"$NEEDS"); do
            result=$(jq -r --arg job "$job" '.[$job].result' <<<"$NEEDS")
            name=${selector[$job]:-$job}
            if jq -e --arg name "$name" 'index($name) != null' <<<"$SELECTED" >/dev/null; then
              [[ "$result" == success ]] || { echo "::error::selected job $job finished $result"; status=1; }
            else
              [[ "$result" == skipped ]] || { echo "::error::unselected job $job finished $result"; status=1; }
            fi
            echo "$job: $result"
          done
          exit "$status"
