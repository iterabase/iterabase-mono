name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TESTCONTAINERS_RYUK_CONTAINER_IMAGE: testcontainers/ryuk:0.14.0@sha256:7c1a8a9a47c780ed0f983770a662f80deb115d95cce3e2daa3d12115b8cd28f0
  GO_CACHE_DEPENDENCIES: |
    control-plane/go.sum
    inference-gateway/go.sum
    forge/go.sum
    forge/test/e2e/go.sum
    testkit/e2e/go.mod
    control-plane/test/e2e/go.mod
    charts/test/e2e/go.mod
    charts/test/e2e/go.sum
    .github/tools/go.sum
    .github/tools/control-plane/go.sum

jobs:
  changes:
    name: select
    runs-on: ubuntu-latest
    outputs:
      control_plane: ${{ steps.select.outputs.control_plane }}
      ui: ${{ steps.select.outputs.ui }}
      harness: ${{ steps.select.outputs.harness }}
      tool_runner: ${{ steps.select.outputs.tool_runner }}
      proto: ${{ steps.select.outputs.proto }}
      inference_gateway: ${{ steps.select.outputs.inference_gateway }}
      forge: ${{ steps.select.outputs.forge }}
      forge_e2e: ${{ steps.select.outputs.forge_e2e }}
      forge_real_e2e: ${{ steps.select.outputs.forge_real_e2e }}
      charts: ${{ steps.select.outputs.charts }}
      nested_go_lint: ${{ steps.select.outputs.nested_go_lint }}
      images: ${{ steps.select.outputs.images }}
      image_matrix: ${{ steps.select.outputs.image_matrix }}
      classification: ${{ steps.select.outputs.classification }}
      selection: ${{ steps.select.outputs.selection }}
      path_record: ${{ steps.select.outputs.path_record }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: shared-testkit
      - name: Test shared E2E mechanics and compiled catalogue
        run: make testkit-test
      - name: Test path-selection and Go lint-owner contracts
        run: |
          python3 .github/scripts/test_select_ci.py
          python3 .github/scripts/test_lint_parity.py
      - name: Test protected release and remote-content contracts
        run: |
          python3 .github/scripts/test_release.py
          python3 .github/scripts/test_remote_content.py
          python3 .github/scripts/release.py validate
          python3 .github/scripts/remote_content.py validate
      - name: Test cache invalidation and exclusions
        run: python3 .github/scripts/test_cache_contract.py
      - name: Test source-authority workflow boundary
        run: .github/scripts/test_source_authority.sh
      - name: Collect changed paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/collect_changed_paths.py --all-event workflow_dispatch
      - name: Select CI owners from the typed path record
        id: select
        run: >-
          python3 .github/scripts/select_ci.py
          --selection-file /tmp/changed-path-selection.json
          --expected-head '${{ github.event.pull_request.head.sha || github.sha }}'

  control-plane:
    name: control-plane
    needs: changes
    if: needs.changes.outputs.control_plane == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: control-plane
      - uses: ./.github/actions/setup-node
        with:
          node-version: 24.19.0
          cache-dependency-path: control-plane/ui/package-lock.json
          cache-scope: control-plane-build
      - name: Install repository-locked control-plane tools
        run: |
          .github/scripts/install_go_tool.sh golangci-lint
          .github/scripts/install_go_tool.sh controller-gen
      - name: Install checksummed envtest runtime
        uses: ./.github/actions/setup-ci-tool
        with: {name: envtest, version: 1.36.2}
      - name: Install Dashboard dependencies
        run: make ui-deps
        working-directory: control-plane
      - name: Formatting
        run: make fmt-check
        working-directory: control-plane
      - name: Lint
        run: make lint
        working-directory: control-plane
      - name: Build
        run: make build
        working-directory: control-plane
      - name: Unit, integration, and envtest
        run: make test
        working-directory: control-plane

  ui:
    name: dashboard
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
        with:
          node-version: 24.19.0
          cache-dependency-path: control-plane/ui/package-lock.json
          cache-scope: dashboard
      - name: Install dependencies
        run: make ui-deps
        working-directory: control-plane
      - name: Typecheck
        run: make ui-lint
        working-directory: control-plane
      - name: Component, interaction, accessibility, and localization tests
        run: make ui-test
        working-directory: control-plane
      - name: Production build
        run: make ui-build
        working-directory: control-plane

  harness:
    name: harness
    needs: changes
    if: needs.changes.outputs.harness == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: harness
      - uses: ./.github/actions/setup-node
        with:
          node-version: 22.23.2
          cache-dependency-path: control-plane/harness/package-lock.json
          cache-scope: harness
      - name: Install dependencies
        run: make harness-deps
        working-directory: control-plane
      - name: Typecheck
        run: make harness-lint
        working-directory: control-plane
      - name: Unit and native transport integration tests
        run: make harness-test
        working-directory: control-plane
      - name: Required Linux process and UID isolation gate (no skip)
        run: make harness-isolation-test
        working-directory: control-plane

  tool-runner:
    name: tool-runner
    needs: changes
    if: needs.changes.outputs.tool_runner == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
        with:
          node-version: 24.19.0
          cache-dependency-path: control-plane/tool-runner/package-lock.json
          cache-scope: tool-runner
      - name: Install dependencies
        run: make tool-runner-deps
        working-directory: control-plane
      - name: Typecheck
        run: make tool-runner-lint
        working-directory: control-plane
      - name: Test
        run: make tool-runner-test
        working-directory: control-plane
      - name: Build
        run: make tool-runner-build
        working-directory: control-plane

  proto:
    name: protobuf
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: protobuf
      - uses: ./.github/actions/setup-node
        with:
          node-version: 22.23.2
          cache-dependency-path: .github/tools/protobuf/package-lock.json
          cache-scope: protobuf-tools
      - name: Install repository-locked protobuf tools
        run: |
          .github/scripts/install_go_tool.sh buf
          .github/scripts/install_go_tool.sh protoc-gen-go
          .github/scripts/install_go_tool.sh protoc-gen-connect-go
          .github/scripts/install_node_tool.sh protoc-gen-es
      - name: Lint, regenerate, and verify committed stubs
        run: make proto-check
        working-directory: control-plane

  inference-gateway:
    name: inference-gateway
    needs: changes
    if: needs.changes.outputs.inference_gateway == 'true'
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.25.12
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: inference-gateway
      - name: Install pinned goimports
        run: .github/scripts/install_go_tool.sh goimports
      - name: Formatting and imports
        run: make fmt-check
        working-directory: inference-gateway
      - name: Vet
        run: go vet ./...
        working-directory: inference-gateway
      - name: Install pinned golangci-lint
        run: .github/scripts/install_go_tool.sh golangci-lint
      - name: Lint
        run: make lint
        working-directory: inference-gateway
      - name: Build
        run: make build
        working-directory: inference-gateway
      - name: Unit and testcontainers integration tests
        run: make test
        working-directory: inference-gateway

  forge:
    name: forge
    needs: changes
    if: needs.changes.outputs.forge == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: forge
      - name: Formatting
        run: make fmt-check
        working-directory: forge
      - name: Install pinned golangci-lint
        run: .github/scripts/install_go_tool.sh golangci-lint
      - name: Lint
        run: make lint
        working-directory: forge
      - name: Install checksummed GoReleaser
        uses: ./.github/actions/setup-ci-tool
        with: {name: goreleaser, version: 2.12.7}
      - name: GoReleaser configuration
        run: goreleaser check
        working-directory: forge
      - name: Build
        run: make build
        working-directory: forge
      - name: Unit and fake-SSH integration tests
        run: make test
        working-directory: forge

  # Founder-approved (HOR-545 Option B): a required, isolated, privileged job that
  # actually executes the real reconcile/purge transaction fault matrix over
  # loop-backed by-id devices. It runs as root with the internal
  # FORGE_FAULT_MATRIX_REQUIRED=1 flag, so it FAILS (never skips) if the LVM/root
  # prerequisites or any matrix stage are unavailable, and FAILS if any stage
  # misbehaves. The generated script only accepts loop devices when the internal
  # FORGE_DATA_STORAGE_FIXTURE_LOOP env is present (injected here); normal forge
  # apply never sets it and rejects loop devices unchanged.
  forge-fault-matrix:
    name: forge-fault-matrix
    needs: changes
    if: needs.changes.outputs.forge == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: forge
      - name: Install LVM toolchain for the privileged fault matrix
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lvm2 psmisc
      - name: Execute the executable fault-stage matrix (privileged, fail-closed)
        working-directory: forge
        run: |
          GOMODCACHE="$(go env GOMODCACHE)"
          sudo env "HOME=/tmp/forge-fx" "PATH=$PATH" "GOMODCACHE=$GOMODCACHE" \
            FORGE_FAULT_MATRIX_REQUIRED=1 go test -count=1 \
            -run 'TestDataStorageFaultStageMatrixExecutable|TestDataStorageReapplyReceiptMonotonicExecutable|TestDataStoragePurgeFaultStageMatrixExecutable|TestDataStorageLoopDevicesRejectedWithoutFixtureFlag' \
            ./internal/sshprovisioner/

  charts:
    name: charts-static
    needs: changes
    if: needs.changes.outputs.charts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-kubernetes-tools
      - uses: ./.github/actions/cache-helm
        with:
          cache-scope: charts-static
      - name: Add external chart repositories
        run: .github/scripts/add_helm_repositories.sh
      - name: Lint, template, kubeconform, and chart contracts
        run: make check
        working-directory: charts
      - name: Internal TLS static contracts
        run: make check-tls
        working-directory: charts

  # Shared Go E2E modules are compiled and tested by several owners but are not
  # linted by any of their product jobs. This dedicated job installs the
  # repository-pinned golangci-lint and runs it in every nested module, so a
  # required aggregate cannot pass while the canonical local lint matrix fails.
  # `.github/ci/go-lint-owners.json` names this job as the PR and candidate lint
  # owner for all four modules; `.github/scripts/test_lint_parity.py` fails when
  # that ownership or this wiring drifts.
  nested-go-lint:
    name: nested-go-lint
    needs: changes
    if: needs.changes.outputs.nested_go_lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact lint source
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: nested-go-lint
      - name: Install pinned golangci-lint
        run: .github/scripts/install_go_tool.sh golangci-lint
      - name: Lint charts/test/e2e
        working-directory: charts/test/e2e
        run: golangci-lint run ./...
      - name: Lint control-plane/test/e2e
        working-directory: control-plane/test/e2e
        run: golangci-lint run ./...
      - name: Lint forge/test/e2e
        working-directory: forge/test/e2e
        run: golangci-lint run ./...
      - name: Lint testkit/e2e
        working-directory: testkit/e2e
        run: golangci-lint run ./...

  images:
    name: image-${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.image_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact builder source
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Report BuildKit cache source and invalidation boundary
        run: |
          echo "BuildKit cache source: GHA scope ci-${{ matrix.name }}"
          echo "BuildKit content digests include context ${{ matrix.context }} and Dockerfile ${{ matrix.dockerfile }}."
      - uses: ./.github/actions/setup-buildx
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.name }}:ci
          cache-from: type=gha,scope=ci-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.name }}

  required:
    name: CI / required
    if: always()
    needs:
      - changes
      - control-plane
      - ui
      - harness
      - tool-runner
      - proto
      - inference-gateway
      - forge
      - forge-fault-matrix
      - charts
      - nested-go-lint
      - images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require the exact typed selection and every selected owner
        env:
          NEEDS: ${{ toJSON(needs) }}
          PATH_RECORD: ${{ needs.changes.outputs.path_record }}
        run: |
          printf '%s\n' "$PATH_RECORD" > '${{ runner.temp }}/path-record.json'
          python3 .github/scripts/select_ci.py \
            --selection-file '${{ runner.temp }}/path-record.json' \
            --expected-head '${{ github.event.pull_request.head.sha || github.sha }}' \
            --validate-needs-env NEEDS
