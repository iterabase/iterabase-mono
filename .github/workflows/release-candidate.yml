name: Release candidate

on:
  workflow_dispatch:
    inputs:
      targets:
        description: Comma-separated affected release targets
        required: true
        type: string
      master_sha:
        description: Full source SHA (contained in master unless rehearsal)
        required: true
        type: string
      baseline_anchor_release_id:
        description: Exact numeric GitHub Latest Release ID to pin as the complete parent baseline
        required: true
        type: string
      rehearsal:
        description: Validate an exact branch head without creating a promotable candidate
        required: false
        type: boolean
        default: false

concurrency:
  group: release-candidate-${{ inputs.master_sha }}-${{ inputs.targets }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  packages: read

env:
  TESTCONTAINERS_RYUK_CONTAINER_IMAGE: testcontainers/ryuk:0.14.0@sha256:7c1a8a9a47c780ed0f983770a662f80deb115d95cce3e2daa3d12115b8cd28f0
  GO_CACHE_DEPENDENCIES: |
    control-plane/go.sum
    inference-gateway/go.sum
    forge/go.sum
    forge/test/e2e/go.sum
    testkit/e2e/go.mod
    control-plane/test/e2e/go.mod
    charts/test/e2e/go.mod
    charts/test/e2e/go.sum
    .github/tools/go.sum
    .github/tools/control-plane/go.sum

jobs:
  preflight:
    name: Candidate preflight
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.resolved.outputs.plan }}
      targets: ${{ steps.resolved.outputs.targets }}
      releases: ${{ steps.resolved.outputs.releases }}
      forge_version: ${{ steps.resolved.outputs.forge_version }}
      forge_recipe_sha256: ${{ steps.resolved.outputs.forge_recipe_sha256 }}
      image_matrix: ${{ steps.resolved.outputs.image_matrix }}
      chart_matrix: ${{ steps.resolved.outputs.chart_matrix }}
      runtime_artifact_matrix: ${{ steps.resolved.outputs.runtime_artifact_matrix }}
      kind_matrix: ${{ steps.resolved.outputs.kind_matrix }}
      real_machine_matrix: ${{ steps.resolved.outputs.real_machine_matrix }}
      has_images: ${{ steps.resolved.outputs.has_images }}
      has_chart: ${{ steps.resolved.outputs.has_chart }}
      has_forge: ${{ steps.resolved.outputs.has_forge }}
      has_runtime_artifacts: ${{ steps.resolved.outputs.has_runtime_artifacts }}
      run_control_plane: ${{ steps.resolved.outputs.run_control_plane }}
      run_inference_gateway: ${{ steps.resolved.outputs.run_inference_gateway }}
      run_forge: ${{ steps.resolved.outputs.run_forge }}
      run_charts: ${{ steps.resolved.outputs.run_charts }}
      run_nested_go_lint: ${{ steps.resolved.outputs.run_nested_go_lint }}
      run_kind: ${{ steps.resolved.outputs.run_kind }}
      run_real_machine: ${{ steps.resolved.outputs.run_real_machine }}
    steps:
      - name: Require an explicit candidate source mode
        env:
          REHEARSAL: ${{ inputs.rehearsal }}
        run: |
          if [ "$REHEARSAL" = true ]; then
            test '${{ github.ref }}' != refs/heads/master
          else
            test '${{ github.ref }}' = refs/heads/master
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.master_sha }}
          fetch-depth: 0
      - name: Verify exact source authority
        env:
          REQUESTED_SHA: ${{ inputs.master_sha }}
          REHEARSAL: ${{ inputs.rehearsal }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          if [ "$REHEARSAL" = true ]; then
            test "$REQUESTED_SHA" = "$DISPATCH_SHA"
          else
            git fetch --no-tags origin master
            git merge-base --is-ancestor "$REQUESTED_SHA" origin/master
          fi
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: candidate-plan
      - uses: ./.github/actions/setup-kubernetes-tools
      - name: Install checksummed Buildx for immutable baseline inspection
        uses: ./.github/actions/setup-ci-tool
        with: {name: buildx, version: 0.36.1}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to the chart registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | helm registry login ghcr.io -u '${{ github.actor }}' --password-stdin
      - name: Validate and compile one candidate execution plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TARGETS: ${{ inputs.targets }}
          REQUESTED_SHA: ${{ inputs.master_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CANDIDATE_REPOSITORY: ${{ github.repository }}
          CANDIDATE_WORKFLOW: ${{ github.workflow_ref }}
          CANDIDATE_EVENT: ${{ github.event_name }}
          CANDIDATE_CONTROL_SHA: ${{ github.sha }}
        run: |
          python3 .github/scripts/test_e2e.py
          python3 .github/scripts/test_release.py
          python3 .github/scripts/test_lint_parity.py
          python3 .github/scripts/test_remote_content.py
          python3 .github/scripts/release.py validate
          python3 .github/scripts/remote_content.py validate
          workflow_ref="${CANDIDATE_WORKFLOW%%@*}"
          workflow_path="${workflow_ref#"$CANDIDATE_REPOSITORY/"}"
          python3 .github/scripts/release.py plan \
            --targets "$REQUESTED_TARGETS" \
            --master-sha "$REQUESTED_SHA" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --repository "$CANDIDATE_REPOSITORY" \
            --workflow "$workflow_path" \
            --event "$CANDIDATE_EVENT" \
            --control-sha "$CANDIDATE_CONTROL_SHA" \
            --baseline-anchor-release-id '${{ inputs.baseline_anchor_release_id }}' \
            --output candidate-plan.json
      - name: Reject existing protected production tags
        if: inputs.rehearsal != true
        run: |
          while IFS= read -r tag; do
            test -z "$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")"
          done < <(jq -r '.[].production_tag' candidate-plan.json)
      - name: Reject existing semantic artifacts before candidate validation
        if: inputs.rehearsal != true
        run: .github/scripts/check_release_availability.sh candidate-plan.json '${{ github.repository_owner }}'
      - name: Verify the one pinned complete published baseline snapshot
        run: |
          python3 .github/scripts/e2e.py resolve-baselines --plan candidate-plan.json
          jq -cS . candidate-plan.json > candidate-plan.normalized.json
          mv candidate-plan.normalized.json candidate-plan.json
      - name: Export the fully resolved plan
        id: resolved
        run: >-
          python3 .github/scripts/release.py outputs
          --plan candidate-plan.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-plan
          path: candidate-plan.json
          retention-days: 90

  control-plane-source:
    name: Control-plane owner checks
    needs: preflight
    if: needs.preflight.outputs.run_control_plane == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ inputs.master_sha }}"}
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: candidate-control-plane
      - uses: ./.github/actions/setup-node
        with:
          node-version: 24.19.0
          cache-dependency-path: |
            control-plane/ui/package-lock.json
            control-plane/harness/package-lock.json
            control-plane/tool-runner/package-lock.json
            .github/tools/protobuf/package-lock.json
          cache-scope: candidate-control-plane
      - name: Install repository-locked control-plane and protobuf tools
        run: |
          .github/scripts/install_go_tool.sh golangci-lint
          .github/scripts/install_go_tool.sh controller-gen
          .github/scripts/install_go_tool.sh buf
          .github/scripts/install_go_tool.sh protoc-gen-go
          .github/scripts/install_go_tool.sh protoc-gen-connect-go
          .github/scripts/install_node_tool.sh protoc-gen-es
      - name: Install checksummed envtest runtime
        uses: ./.github/actions/setup-ci-tool
        with: {name: envtest, version: 1.36.2}
      - run: make ui-deps harness-deps tool-runner-deps
        working-directory: control-plane
      - run: >-
          make fmt-check lint build test test-e2e-unit proto-check
          ui-lint ui-test harness-lint harness-test
          tool-runner-lint tool-runner-test tool-runner-build
        working-directory: control-plane

  inference-gateway-source:
    name: Inference-gateway owner checks
    needs: preflight
    if: needs.preflight.outputs.run_inference_gateway == 'true'
    runs-on: ubuntu-latest
    env: {GOWORK: "off"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ inputs.master_sha }}"}
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.25.12
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: candidate-inference-gateway
      - run: .github/scripts/install_go_tool.sh goimports
      - run: .github/scripts/install_go_tool.sh golangci-lint
      - run: make fmt-check lint build test
        working-directory: inference-gateway

  forge-source:
    name: Forge owner checks
    needs: preflight
    if: needs.preflight.outputs.run_forge == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ inputs.master_sha }}"}
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: candidate-forge
      - run: make fmt-check test test-e2e-unit
        working-directory: forge
      - run: .github/scripts/install_go_tool.sh golangci-lint
      - run: make lint
        working-directory: forge

  charts-source:
    name: Charts static checks
    needs: preflight
    if: needs.preflight.outputs.run_charts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ inputs.master_sha }}"}
      - uses: ./.github/actions/setup-kubernetes-tools
      - uses: ./.github/actions/cache-helm
        with: {cache-scope: candidate-charts}
      - run: .github/scripts/add_helm_repositories.sh
      - run: make check check-tls test-e2e-unit
        working-directory: charts

  # Shared Go E2E modules have no product target of their own, and the shared
  # testkit participates in every candidate's compiled E2E execution. This job
  # is always selected: it installs the repository-pinned golangci-lint and
  # lints every nested module against the exact requested master SHA before the
  # candidate can be promoted. `.github/ci/go-lint-owners.json` records it as
  # the candidate lint owner for all four modules.
  nested-go-lint:
    name: Nested Go module lint
    needs: preflight
    if: needs.preflight.outputs.run_nested_go_lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ inputs.master_sha }}"}
      - name: Verify exact nested-module source
        run: test "$(git rev-parse HEAD)" = '${{ inputs.master_sha }}'
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: candidate-nested-go-lint
      - name: Install pinned golangci-lint
        run: .github/scripts/install_go_tool.sh golangci-lint
      - name: Lint charts/test/e2e
        working-directory: charts/test/e2e
        run: golangci-lint run ./...
      - name: Lint control-plane/test/e2e
        working-directory: control-plane/test/e2e
        run: golangci-lint run ./...
      - name: Lint forge/test/e2e
        working-directory: forge/test/e2e
        run: golangci-lint run ./...
      - name: Lint testkit/e2e
        working-directory: testkit/e2e
        run: golangci-lint run ./...

  image-candidates:
    name: Build image — ${{ matrix.name }}
    needs: preflight
    if: needs.preflight.outputs.has_images == 'true'
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.image_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ inputs.master_sha }}"}
      - name: Verify exact image source
        run: test "$(git rev-parse HEAD)" = '${{ inputs.master_sha }}'
      - uses: ./.github/actions/setup-buildx
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject an existing immutable candidate alias
        env:
          REPOSITORY: ${{ matrix.repository }}
          CANDIDATE_TAG: ${{ matrix.candidate_tag }}
        run: |
          existing="$(docker buildx imagetools inspect "$REPOSITORY:$CANDIDATE_TAG" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"' || true)"
          test -z "$existing"
      - name: Build and push one canonical digest from the reviewed recipe
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          tags: ${{ matrix.repository }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ matrix.labels_text }}
          build-args: ${{ matrix.build_args_text }}
          provenance: mode=max
          cache-from: type=gha,scope=release-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.name }}
      - name: Create immutable run-scoped candidate alias
        env:
          REPOSITORY: ${{ matrix.repository }}
          CANDIDATE_TAG: ${{ matrix.candidate_tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST"
          test -z "$(docker buildx imagetools inspect "$REPOSITORY:$CANDIDATE_TAG" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"' || true)"
          docker buildx imagetools create --tag "$REPOSITORY:$CANDIDATE_TAG" "$REPOSITORY@$DIGEST"
          test "$(docker buildx imagetools inspect "$REPOSITORY:$CANDIDATE_TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')" = "$DIGEST"
      - name: Install checksummed Syft
        uses: ./.github/actions/setup-ci-tool
        with: {name: syft, version: 1.51.0}
      - name: Generate exact image SBOM
        env:
          IMAGE: ${{ matrix.repository }}@${{ steps.build.outputs.digest }}
        run: syft "$IMAGE" --output 'spdx-json=candidate-${{ matrix.name }}.spdx.json'
      - name: Record complete image identity
        env: {DIGEST: "${{ steps.build.outputs.digest }}"}
        run: |
          jq -n \
            --arg name '${{ matrix.name }}' --arg target '${{ matrix.target }}' \
            --arg repository '${{ matrix.repository }}' --arg candidate_tag '${{ matrix.candidate_tag }}' \
            --arg version '${{ matrix.version }}' --arg digest "$DIGEST" \
            --arg source_sha '${{ inputs.master_sha }}' --arg recipe_sha256 '${{ matrix.recipe_sha256 }}' \
            '{schema_version:2,artifact_type:"image",name:$name,target:$target,repository:$repository,candidate_tag:$candidate_tag,version:$version,digest:$digest,source_sha:$source_sha,recipe_sha256:$recipe_sha256}' \
            > candidate-${{ matrix.name }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-image-${{ matrix.name }}
          path: |
            candidate-${{ matrix.name }}.json
            candidate-${{ matrix.name }}.spdx.json
          retention-days: 90

  chart-candidate:
    name: Package chart — ${{ matrix.chart }}
    needs: preflight
    if: needs.preflight.outputs.has_chart == 'true'
    runs-on: ubuntu-latest
    permissions: {contents: read, id-token: write, attestations: write}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.chart_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ inputs.master_sha }}"}
      - name: Verify exact chart source
        run: test "$(git rev-parse HEAD)" = '${{ inputs.master_sha }}'
      - uses: ./.github/actions/setup-kubernetes-tools
      - run: .github/scripts/add_helm_repositories.sh
      - name: Package exact chart and companion archives once
        run: |
          mkdir -p candidate-charts
          for chart in control-plane observability cert-manager-substrate lvm-storage-substrate iterabase-platform; do
            bash charts/scripts/build-chart-dependency.sh "charts/charts/$chart"
          done
          helm package 'charts/charts/${{ matrix.chart }}' --destination candidate-charts
          for companion in $(jq -r '.[]' <<<'${{ toJSON(matrix.companions) }}'); do
            helm package "charts/charts/$companion" --destination candidate-charts
          done
          (cd candidate-charts && sha256sum -- *.tgz > 'checksums-${{ matrix.chart }}.txt')
          jq -n \
            --arg target '${{ matrix.target }}' --arg chart '${{ matrix.chart }}' \
            --arg version '${{ matrix.version }}' --arg source_sha '${{ inputs.master_sha }}' \
            --arg recipe_sha256 '${{ matrix.recipe_sha256 }}' \
            '{schema_version:2,artifact_type:"chart",target:$target,chart:$chart,version:$version,source_sha:$source_sha,recipe_sha256:$recipe_sha256}' \
            > 'candidate-charts/candidate-chart-${{ matrix.chart }}.json'
          while IFS= read -r companion; do
            chart=$(jq -r '.chart' <<<"$companion")
            recipe=$(jq -r '.recipe_sha256' <<<"$companion")
            jq -n --arg target '${{ matrix.target }}' --arg chart "$chart" \
              --arg version '${{ matrix.version }}' --arg source_sha '${{ inputs.master_sha }}' \
              --arg recipe_sha256 "$recipe" \
              '{schema_version:2,artifact_type:"chart-companion",target:$target,chart:$chart,version:$version,source_sha:$source_sha,recipe_sha256:$recipe_sha256}' \
              > "candidate-charts/candidate-chart-$chart.json"
          done < <(jq -c '.[]' <<<'${{ toJSON(matrix.companion_recipes) }}')
          git diff --exit-code
      - name: Install checksummed Syft
        uses: ./.github/actions/setup-ci-tool
        with: {name: syft, version: 1.51.0}
      - name: Generate exact chart SBOM
        run: syft 'dir:charts/charts/${{ matrix.chart }}' --output 'spdx-json=candidate-charts/candidate-chart-${{ matrix.chart }}.spdx.json'
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.3.0
        with:
          subject-path: |
            candidate-charts/*.tgz
            candidate-charts/checksums-${{ matrix.chart }}.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-chart-${{ matrix.chart }}
          path: candidate-charts/
          retention-days: 90

  forge-candidate:
    name: Build Forge platform matrix
    needs: preflight
    if: needs.preflight.outputs.has_forge == 'true'
    runs-on: ubuntu-latest
    permissions: {contents: read, id-token: write, attestations: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ inputs.master_sha }}", fetch-depth: 0}
      - name: Verify exact Forge source
        run: test "$(git rev-parse HEAD)" = '${{ inputs.master_sha }}'
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: forge/go.sum
          cache-scope: candidate-forge-build
      - name: Install checksummed Syft
        uses: ./.github/actions/setup-ci-tool
        with: {name: syft, version: 1.51.0}
      - name: Install checksummed GoReleaser
        uses: ./.github/actions/setup-ci-tool
        with: {name: goreleaser, version: 2.12.7}
      - run: git -c tag.gpgSign=false tag 'v${{ needs.preflight.outputs.forge_version }}' '${{ inputs.master_sha }}'
      - name: Build the exact Forge release archives
        working-directory: forge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: v${{ needs.preflight.outputs.forge_version }}
        run: goreleaser release --clean --skip=publish --release-notes /dev/null
      - name: Verify GoReleaser did not change source authority
        run: git diff --exit-code -- forge/go.mod forge/go.sum
      - name: Record exact Forge matrix
        run: |
          mkdir forge-candidate
          cp forge/dist/forge_*.tar.gz forge/dist/forge_*.tar.gz.sbom.json forge/dist/checksums.txt forge-candidate/
          jq -n --arg target forge --arg version '${{ needs.preflight.outputs.forge_version }}' \
            --arg source_sha '${{ inputs.master_sha }}' --arg recipe_sha256 '${{ needs.preflight.outputs.forge_recipe_sha256 }}' \
            '{schema_version:2,artifact_type:"forge",target:$target,version:$version,source_sha:$source_sha,recipe_sha256:$recipe_sha256}' \
            > forge-candidate/candidate-forge.json
          test "$(find forge-candidate -name 'forge_*.tar.gz' -type f | wc -l | tr -d ' ')" = 4
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.3.0
        with:
          subject-path: |
            forge-candidate/*.tar.gz
            forge-candidate/checksums.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-forge
          path: forge-candidate/
          retention-days: 90

  runtime-artifacts:
    name: Build validation artifact — ${{ matrix.artifact }}
    needs: preflight
    if: needs.preflight.outputs.has_runtime_artifacts == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.runtime_artifact_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ inputs.master_sha }}"}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: candidate-plan, path: "${{ runner.temp }}/plan"}
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: candidate-runtime-${{ matrix.artifact }}
      - uses: ./.github/actions/setup-kubernetes-tools
      - name: Install checksummed GoReleaser
        if: matrix.kind == 'forge'
        uses: ./.github/actions/setup-ci-tool
        with: {name: goreleaser, version: 2.12.7}
      - run: >-
          python3 .github/scripts/e2e.py build-artifact
          --plan '${{ runner.temp }}/plan/candidate-plan.json'
          --artifact '${{ matrix.artifact }}'
          --output '${{ runner.temp }}/runtime-artifact'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-runtime-${{ matrix.artifact }}
          path: ${{ runner.temp }}/runtime-artifact/
          retention-days: 90

  kind-candidates:
    name: ${{ matrix.id }}
    needs: [preflight, image-candidates, chart-candidate, forge-candidate, runtime-artifacts]
    if: >-
      always() && needs.preflight.result == 'success' && needs.preflight.outputs.run_kind == 'true' &&
      (needs.image-candidates.result == 'success' || needs.image-candidates.result == 'skipped') &&
      (needs.chart-candidate.result == 'success' || needs.chart-candidate.result == 'skipped') &&
      (needs.forge-candidate.result == 'success' || needs.forge-candidate.result == 'skipped') &&
      (needs.runtime-artifacts.result == 'success' || needs.runtime-artifacts.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    permissions: {contents: read, packages: read}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.kind_matrix) }}
    concurrency:
      group: candidate-scenario-${{ matrix.artifact }}-${{ inputs.master_sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ inputs.master_sha }}"}
      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = '${{ inputs.master_sha }}'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: candidate-plan, path: "${{ runner.temp }}/plan"}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {pattern: "candidate-*", path: "${{ runner.temp }}/artifacts"}
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: candidate-${{ matrix.artifact }}
      - uses: ./.github/actions/setup-node
        if: matrix.target == 'test-e2e-browser'
        with:
          node-version: 24.19.0
          cache-dependency-path: control-plane/test/e2e/playwright/package-lock.json
          cache-scope: candidate-browser
      - uses: ./.github/actions/setup-playwright
        if: matrix.target == 'test-e2e-browser'
        with: {version: 1.62.1}
      - uses: ./.github/actions/setup-kubernetes-tools
      - name: Compose the single verified candidate runtime
        run: >-
          python3 .github/scripts/e2e.py compose
          --plan '${{ runner.temp }}/plan/candidate-plan.json'
          --scenario '${{ matrix.id }}'
          --artifacts '${{ runner.temp }}/artifacts'
          --output '${{ runner.temp }}/runtime'
          --env-output "$GITHUB_ENV"
      - name: Bind the candidate result and retained runtime authority
        run: |
          mkdir -p '${{ runner.temp }}/result'
          cp '${{ runner.temp }}/runtime/runtime-bundle.json' '${{ runner.temp }}/result/runtime-bundle.json'
          echo 'ITERABASE_E2E_RESULT=${{ runner.temp }}/result/result.json' >> "$GITHUB_ENV"
      - name: Run the compiled scenario against that runtime
        working-directory: ${{ matrix.owner }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          E2E_SKIP_BUILD_DEPS: "true"
          ITERABASE_E2E_DIAGNOSTICS: ${{ runner.temp }}/diagnostics/${{ matrix.artifact }}
        run: make '${{ matrix.target }}'
      - name: Retain strict candidate result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-result-${{ matrix.artifact }}
          path: ${{ runner.temp }}/result/
          if-no-files-found: error
          retention-days: 90
      - name: Retain diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-diagnostics-${{ matrix.artifact }}
          path: ${{ runner.temp }}/diagnostics/${{ matrix.artifact }}
          if-no-files-found: ignore
          retention-days: 7

  real-machine-candidates:
    name: ${{ matrix.capacity }}
    needs: [preflight, image-candidates, chart-candidate, forge-candidate, runtime-artifacts]
    if: >-
      always() && needs.preflight.result == 'success' && needs.preflight.outputs.run_real_machine == 'true' &&
      (needs.image-candidates.result == 'success' || needs.image-candidates.result == 'skipped') &&
      (needs.chart-candidate.result == 'success' || needs.chart-candidate.result == 'skipped') &&
      (needs.forge-candidate.result == 'success' || needs.forge-candidate.result == 'skipped') &&
      (needs.runtime-artifacts.result == 'success' || needs.runtime-artifacts.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    permissions: {contents: read, packages: read}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.real_machine_matrix) }}
    concurrency:
      group: iterabase-permanent-fixture-${{ matrix.capacity }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ inputs.master_sha }}"}
      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = '${{ inputs.master_sha }}'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: candidate-plan, path: "${{ runner.temp }}/plan"}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {pattern: "candidate-*", path: "${{ runner.temp }}/artifacts"}
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCIES }}
          cache-scope: candidate-real-${{ matrix.capacity }}
      - uses: ./.github/actions/setup-kubernetes-tools
      - name: Authorize the founder-only fixture trust boundary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REPOSITORY: ${{ github.repository }}
        run: .github/scripts/verify_fixture_trust.sh
      - name: Bind the fixed permanent fixture
        uses: ./.github/actions/setup-permanent-fixture
        with:
          capacity: ${{ matrix.capacity }}
          address: ${{ matrix.capacity == 'cpu' && vars.FORGE_E2E_CPU_ADDRESS || vars.FORGE_E2E_GPU_ADDRESS }}
          ssh-user: ${{ matrix.capacity == 'cpu' && vars.FORGE_E2E_CPU_SSH_USER || vars.FORGE_E2E_GPU_SSH_USER }}
          ssh-private-key: ${{ matrix.capacity == 'cpu' && secrets.FORGE_E2E_CPU_SSH_KEY || secrets.FORGE_E2E_GPU_SSH_KEY }}
          ssh-host-key: ${{ matrix.capacity == 'cpu' && vars.FORGE_E2E_CPU_SSH_HOST_KEY || vars.FORGE_E2E_GPU_SSH_HOST_KEY }}
          data-storage-device: ${{ matrix.capacity == 'cpu' && vars.FORGE_E2E_CPU_DATA_STORAGE_DEVICE || vars.FORGE_E2E_GPU_DATA_STORAGE_DEVICE }}
          model-cache-device: ${{ matrix.capacity == 'gpu' && vars.FORGE_E2E_GPU_MODEL_CACHE_DEVICE || '' }}
          model-cache-uuid: ${{ matrix.capacity == 'gpu' && vars.FORGE_E2E_GPU_MODEL_CACHE_UUID || '' }}
      - name: Compute pinned image cache identity
        env:
          CAPACITY: ${{ matrix.capacity }}
        run: |
          set -euo pipefail
          manifest="$(python3 .github/scripts/fixture_image_cache.py manifest --capacity "$CAPACITY")"
          printf 'FORGE_E2E_IMAGE_CACHE_ROOT=%s\n' "$(jq -r '.cache_root' <<<"$manifest")" >> "$GITHUB_ENV"
          printf 'FORGE_E2E_IMAGE_CACHE_GENERATION=%s\n' "$(jq -r '.generation' <<<"$manifest")" >> "$GITHUB_ENV"
      - name: Compose and run every candidate scenario for this fixture serially
        env:
          SCENARIOS: ${{ toJSON(matrix.scenarios) }}
          GH_RUNTIME_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p '${{ runner.temp }}/results' '${{ runner.temp }}/diagnostics'
          status=0
          while IFS= read -r scenario; do
            id=$(jq -r '.id' <<<"$scenario")
            owner=$(jq -r '.owner' <<<"$scenario")
            target=$(jq -r '.target' <<<"$scenario")
            artifact=$(jq -r '.artifact' <<<"$scenario")
            runtime='${{ runner.temp }}/runtime-'"$artifact"
            envfile='${{ runner.temp }}/env-'"$artifact"
            : > "$envfile"
            python3 .github/scripts/e2e.py compose \
              --plan '${{ runner.temp }}/plan/candidate-plan.json' \
              --scenario "$id" \
              --artifacts '${{ runner.temp }}/artifacts' \
              --output "$runtime" \
              --env-output "$envfile"
            cp "$runtime/runtime-bundle.json" '${{ runner.temp }}/results/'"$artifact.runtime-bundle.json"
            if ! (
              set -a
              source "$envfile"
              set +a
              export GITHUB_TOKEN="$GH_RUNTIME_TOKEN"
              export FORGE_E2E_REQUIRE_CAPACITY=true
              export ITERABASE_E2E_RESULT='${{ runner.temp }}/results/'"$artifact.json"
              export ITERABASE_E2E_DIAGNOSTICS='${{ runner.temp }}/diagnostics/'"$artifact"
              make -C "$owner" "$target"
            ); then
              status=1
            fi
          done < <(jq -c '.[]' <<<"$SCENARIOS")
          exit "$status"
      - name: Retain strict candidate capacity results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-result-permanent-fixture-${{ matrix.capacity }}
          path: ${{ runner.temp }}/results/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain capacity diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-diagnostics-permanent-fixture-${{ matrix.capacity }}
          path: ${{ runner.temp }}/diagnostics
          if-no-files-found: ignore
          retention-days: 7

  validation:
    name: Candidate validation / required
    if: always()
    needs:
      - preflight
      - control-plane-source
      - inference-gateway-source
      - forge-source
      - charts-source
      - nested-go-lint
      - image-candidates
      - runtime-artifacts
      - chart-candidate
      - forge-candidate
      - kind-candidates
      - real-machine-candidates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ inputs.master_sha }}"}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: candidate-plan, path: "${{ runner.temp }}/plan"}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {pattern: "candidate-result-*", path: "${{ runner.temp }}/results"}
      - name: Reconcile every selected scenario, stage, and artifact identity
        run: >-
          python3 .github/scripts/e2e.py validate-results
          --plan '${{ runner.temp }}/plan/candidate-plan.json'
          --results '${{ runner.temp }}/results'
      - name: Require every selected build and execution job
        run: |
          jq -n \
            --arg preflight '${{ needs.preflight.result }}' \
            --arg control_plane_source '${{ needs.control-plane-source.result }}' \
            --arg inference_gateway_source '${{ needs.inference-gateway-source.result }}' \
            --arg forge_source '${{ needs.forge-source.result }}' \
            --arg charts_source '${{ needs.charts-source.result }}' \
            --arg nested_go_lint '${{ needs.nested-go-lint.result }}' \
            --arg image_candidates '${{ needs.image-candidates.result }}' \
            --arg runtime_artifacts '${{ needs.runtime-artifacts.result }}' \
            --arg chart_candidate '${{ needs.chart-candidate.result }}' \
            --arg forge_candidate '${{ needs.forge-candidate.result }}' \
            --arg kind_candidates '${{ needs.kind-candidates.result }}' \
            --arg real_machine_candidates '${{ needs.real-machine-candidates.result }}' \
            '{
              "preflight":{"result":$preflight},
              "control-plane-source":{"result":$control_plane_source},
              "inference-gateway-source":{"result":$inference_gateway_source},
              "forge-source":{"result":$forge_source},
              "charts-source":{"result":$charts_source},
              "nested-go-lint":{"result":$nested_go_lint},
              "image-candidates":{"result":$image_candidates},
              "runtime-artifacts":{"result":$runtime_artifacts},
              "chart-candidate":{"result":$chart_candidate},
              "forge-candidate":{"result":$forge_candidate},
              "kind-candidates":{"result":$kind_candidates},
              "real-machine-candidates":{"result":$real_machine_candidates}
            }' > '${{ runner.temp }}/candidate-job-results.json'
          python3 .github/scripts/release.py validate-jobs \
            --plan '${{ runner.temp }}/plan/candidate-plan.json' \
            --needs '${{ runner.temp }}/candidate-job-results.json'

  evidence:
    name: Assemble immutable candidate record
    if: always() && needs.preflight.result == 'success' && needs.validation.result == 'success'
    needs: [preflight, validation]
    runs-on: ubuntu-latest
    permissions: {contents: read, id-token: write, attestations: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ inputs.master_sha }}"}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: candidate-plan, path: candidate}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.preflight.outputs.has_images == 'true'
        with: {pattern: "candidate-image-*", path: candidate/assets/images, merge-multiple: true}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.preflight.outputs.has_chart == 'true'
        with: {pattern: "candidate-chart-*", path: candidate/assets/charts, merge-multiple: true}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.preflight.outputs.has_forge == 'true'
        with: {name: candidate-forge, path: candidate/assets/forge}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.preflight.outputs.has_runtime_artifacts == 'true'
        with: {pattern: "candidate-runtime-*", path: candidate/assets/runtime}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {pattern: "candidate-result-*", path: candidate/assets/results}
      - name: Generate and verify retained per-scenario candidate evidence
        run: |
          python3 .github/scripts/e2e.py validate-results \
            --plan candidate/candidate-plan.json --results candidate/assets/results
          python3 .github/scripts/release.py evidence \
            --plan candidate/candidate-plan.json \
            --assets candidate/assets \
            --output candidate/candidate-evidence.json
          test -f candidate/candidate-snapshot.json
          test -f candidate/planned-final-snapshot.json
          test "$(find candidate/planned-release-manifests -name 'release-manifest-*.json' -type f | wc -l | tr -d ' ')" = "$(jq '.targets | length' candidate/candidate-plan.json)"
          python3 .github/scripts/release.py verify-candidate --directory candidate
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.3.0
        with: {subject-path: candidate/candidate-evidence.json}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: candidate/
          retention-days: 90
