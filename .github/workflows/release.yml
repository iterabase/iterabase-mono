name: Release

# Official release of an explicit target set at one commit on master (C10):
# required checks green at that commit, a plan proving every member is
# unpublished and every reference is published or released together (C7), full
# validation of exactly what ships, founder approval in the protected release
# environment, then promotion of the tested digests, charts packaged as-is and
# Forge from GoReleaser, provenance attestations, namespaced tags and one
# Release per target (C8). A broken release is fixed forward with a patch.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact commit on master to release
        required: true
      targets:
        description: Comma-separated release targets (see release/targets.json)
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      members: ${{ steps.plan.outputs.members }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: Require an exact commit on master
        env:
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full commit"; exit 1; }
          git merge-base --is-ancestor "$SHA" origin/master || { echo "::error::$SHA is not on master"; exit 1; }
      - name: Require CI and E2E green at that commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          for check in "CI / required" "E2E / required"; do
            conclusion=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" \
              --jq "[.check_runs[] | select(.name == \"$check\")] | sort_by(.completed_at) | last | .conclusion // \"missing\"")
            [[ "$conclusion" == success ]] || { echo "::error::$check is $conclusion at $SHA"; exit 1; }
          done
      - name: Plan the release
        id: plan
        run: |
          set -euo pipefail
          members=$(python3 release/release_plan.py --targets '${{ inputs.targets }}' --sha '${{ inputs.sha }}')
          echo "members=$members" >> "$GITHUB_OUTPUT"
          {
            echo "### Release plan for \`${{ inputs.sha }}\`"
            echo
            jq -r '.[] | "- `\(.tag)`\(if .latest then " (Latest)" else "" end)"' <<<"$members"
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: full validation
    needs: plan
    permissions:
      contents: read
      id-token: write
      packages: write
      deployments: write
      actions: read
      issues: write
    uses: ./.github/workflows/full-validation.yml
    secrets: inherit
    with:
      ref: ${{ inputs.sha }}
      release_targets: ${{ inputs.targets }}

  publish:
    name: publish
    needs: [plan, validate]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      SHA: ${{ inputs.sha }}
      MEMBERS: ${{ needs.plan.outputs.members }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the annotated release tags locally
        run: |
          set -euo pipefail
          git config user.name iterabase-release
          git config user.email release@iterabase.com
          while IFS= read -r tag; do
            git -c tag.gpgSign=false tag -a "$tag" "$SHA" -m "Release $tag from $SHA"
          done < <(jq -r '.[].tag' <<<"$MEMBERS")
      - name: Install repository-locked crane
        run: .github/scripts/install_ci_tool.sh crane v0.22.1
      - uses: ./.github/actions/setup-kubernetes-tools
      - uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.5
          cache-dependency-path: forge/go.sum
          cache-scope: release
      - name: Install checksummed GoReleaser
        uses: ./.github/actions/setup-ci-tool
        with: {name: goreleaser, version: 2.12.7}
      - name: Install checksummed syft for GoReleaser SBOMs
        uses: ./.github/actions/setup-ci-tool
        with: {name: syft, version: 1.51.0}

      - name: Promote the tested image digests (C8)
        id: images
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r image version; do
            source="ghcr.io/iterabase/preview/$image:sha-$SHA"
            digest=$(crane digest "$source")
            crane copy "$source@$digest" "ghcr.io/iterabase/$image:$version"
            promoted=$(crane digest "ghcr.io/iterabase/$image:$version")
            [[ "$promoted" == "$digest" ]] || { echo "::error::$image promoted as $promoted, tested $digest"; exit 1; }
            echo "${image//-/_}=$digest" >> "$GITHUB_OUTPUT"
            echo "- \`ghcr.io/iterabase/$image:$version\` = \`$digest\` (identical to \`sha-$SHA\`)" >> "$GITHUB_STEP_SUMMARY"
          done < <(jq -r '.[] | .version as $v | .artifacts[] | select(.kind == "image") | [.image, $v] | @tsv' <<<"$MEMBERS")
      - name: Attest control-plane
        if: steps.images.outputs.control_plane != ''
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.3.0
        with: {subject-name: ghcr.io/iterabase/control-plane, subject-digest: "${{ steps.images.outputs.control_plane }}", push-to-registry: true}
      - name: Attest control-plane-harness
        if: steps.images.outputs.control_plane_harness != ''
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.3.0
        with: {subject-name: ghcr.io/iterabase/control-plane-harness, subject-digest: "${{ steps.images.outputs.control_plane_harness }}", push-to-registry: true}
      - name: Attest control-plane-tool-runner
        if: steps.images.outputs.control_plane_tool_runner != ''
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.3.0
        with: {subject-name: ghcr.io/iterabase/control-plane-tool-runner, subject-digest: "${{ steps.images.outputs.control_plane_tool_runner }}", push-to-registry: true}
      - name: Attest inference-gateway
        if: steps.images.outputs.inference_gateway != ''
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.3.0
        with: {subject-name: ghcr.io/iterabase/inference-gateway, subject-digest: "${{ steps.images.outputs.inference_gateway }}", push-to-registry: true}

      - name: Package and push charts as-is, build Forge (C8)
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          .github/scripts/add_helm_repositories.sh
          make -C charts build-deps
          while IFS=$'\t' read -r target chart; do
            mkdir -p "dist/$target"
            helm package "charts/charts/$chart" --destination "dist/$target"
            helm push "dist/$target/$chart-"*.tgz oci://ghcr.io/iterabase/iterabase-charts
          done < <(jq -r '.[] | .target as $t | .artifacts[] | select(.chart) | [$t, .chart] | @tsv' <<<"$MEMBERS")
          version=$(jq -r '.[] | select(.target == "forge") | .version' <<<"$MEMBERS")
          if [[ -n "$version" ]]; then
            (cd forge && GORELEASER_CURRENT_TAG="forge-v$version" goreleaser release --clean --skip=publish,validate)
            mkdir -p dist/forge && cp forge/dist/*.tar.gz forge/dist/checksums.txt dist/forge/
          fi
          if compgen -G "dist/*/*" >/dev/null; then echo "any=true" >> "$GITHUB_OUTPUT"; fi
      - name: Attest chart and Forge archives
        if: steps.files.outputs.any == 'true'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.3.0
        with:
          subject-path: dist/*/*

      - name: Push protected namespaced tags with the release deploy key
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_SSH_KEY: ${{ secrets.RELEASE_TAG_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$RELEASE_TAG_SSH_KEY" > "$RUNNER_TEMP/release-tag"
          chmod 600 "$RUNNER_TEMP/release-tag"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > ~/.ssh/known_hosts
          git remote set-url origin "git@github.com:$GITHUB_REPOSITORY.git"
          git config core.sshCommand "ssh -i $RUNNER_TEMP/release-tag -o IdentitiesOnly=yes"
          while IFS= read -r tag; do
            git push origin "refs/tags/$tag"
          done < <(jq -r '.[].tag' <<<"$MEMBERS")
      - name: Publish one Release per target
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r target tag version latest; do
            notes="Release of **$target $version** from \`$SHA\`, fully validated and founder-approved in $RUN_URL. Images are the tested \`sha-$SHA\` digests; charts and archives carry build-provenance attestations."
            assets=()
            if [[ -d "dist/$target" ]]; then assets=(dist/"$target"/*); fi
            gh release create "$tag" --verify-tag --title "$target $version" --notes "$notes" \
              --latest="$latest" "${assets[@]}"
          done < <(jq -r '.[] | [.target, .tag, .version, (.latest | tostring)] | @tsv' <<<"$MEMBERS")
