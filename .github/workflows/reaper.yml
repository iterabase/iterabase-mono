# Scheduled reaper for the `iterabase-ci` account (DES-HOR-591-01/02, C1, C6,
# C9, docs/runbooks/aws-ci.md). It terminates instances that carry the
# `iterabase-ci=true` marker once their `iterabase-ci-deadline` has passed (fixtures
# and previews; previews renew theirs on each deploy) or once they exceed the
# maximum host age, in every allowed region, and keeps only the newest baked
# fixture-AMI and model-cache generations. Instances without the marker are only
# reported: the role cannot terminate them, and this workflow never tries.
name: Reaper

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      max_age_minutes:
        description: Maximum tagged-instance age used when no deadline tag is present
        required: false
        default: "180"
      dry_run:
        description: Report the decisions without terminating anything
        type: boolean
        default: false
      control_instance_id:
        description: Untagged control instance that the reaper must leave alone and cannot terminate
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: reaper
  cancel-in-progress: false

jobs:
  reap:
    name: reap
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-aws-ci
        with:
          role-arn: ${{ vars.AWS_CI_ROLE_ARN }}
          region: ${{ vars.AWS_CI_REGION }}
          session-name: iterabase-ci-reaper-${{ github.run_id }}
      - name: Terminate aged tagged CI instances
        env:
          MAX_AGE_MINUTES: ${{ inputs.max_age_minutes || '180' }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONTROL_INSTANCE_ID: ${{ inputs.control_instance_id }}
        run: |
          set -euo pipefail
          arguments=(--region '${{ vars.AWS_CI_REGION }}' --max-age-minutes "$MAX_AGE_MINUTES")
          if [ "$DRY_RUN" = "true" ]; then
            arguments+=(--dry-run)
          fi
          if [ -n "$CONTROL_INSTANCE_ID" ]; then
            arguments+=(--control-instance-id "$CONTROL_INSTANCE_ID")
          fi
          python3 .github/scripts/aws_ci.py reap "${arguments[@]}"

  images:
    name: baked image retention
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-aws-ci
        with:
          role-arn: ${{ vars.AWS_CI_ROLE_ARN }}
          region: ${{ vars.AWS_CI_REGION }}
          session-name: iterabase-ci-retention-${{ github.run_id }}
      - name: Keep the newest baked generations
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          arguments=(--region '${{ vars.AWS_CI_REGION }}')
          if [ "$DRY_RUN" = "true" ]; then
            arguments+=(--dry-run)
          fi
          python3 .github/scripts/aws_ci.py prune-images "${arguments[@]}"

  packages:
    name: preview package retention
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prune preview package versions (C9)
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          arguments=(--repository "$GITHUB_REPOSITORY")
          if [ "$DRY_RUN" = "true" ]; then
            arguments+=(--dry-run)
          fi
          python3 .github/scripts/preview_packages.py "${arguments[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
