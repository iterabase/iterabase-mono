name: Set up checksummed Kubernetes tools
description: Restore verified archives and install exact Helm, Kind, kubectl, and kubeconform versions.
runs:
  using: composite
  steps:
    - name: Compute immutable tool cache key
      id: cache-key
      shell: bash
      run: |
        set -euo pipefail
        # Keyed by only the entries this action installs (C3), so an unrelated
        # remote-content change keeps the tool archives warm.
        digest=$(python3 -c 'import hashlib, json, sys; tools = json.load(open(sys.argv[1]))["tools"]; print(hashlib.sha256(json.dumps(tools, sort_keys=True).encode()).hexdigest())' \
          "$GITHUB_WORKSPACE/.github/inputs/remote-content.json")
        key="${{ runner.os }}-${{ runner.arch }}-kubernetes-tools-${digest}"
        echo "key=$key" >> "$GITHUB_OUTPUT"
        echo "tool cache key: $key"
    - name: Restore exact checksummed tool archives
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/iterabase/tools
        key: ${{ steps.cache-key.outputs.key }}
    - name: Verify archives and install tools
      shell: bash
      run: "$GITHUB_WORKSPACE/.github/scripts/install_kubernetes_tools.sh"
    - name: Report tool cache source and versions
      shell: bash
      run: |
        if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
          echo "tool cache source: exact key ${{ steps.cache-key.outputs.key }}"
        else
          echo "tool cache source: cold (will save ${{ steps.cache-key.outputs.key }})"
        fi
        helm version --short
        kind version
        kubectl version --client=true
        kubeconform -v
