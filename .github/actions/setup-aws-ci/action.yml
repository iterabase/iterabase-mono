name: Assume the AWS CI role through GitHub OIDC

description: Require the AWS CI repository variables and assume the CI role without static keys

inputs:
  role-arn:
    required: true
    description: AWS_CI_ROLE_ARN repository variable
  region:
    required: true
    description: AWS_CI_REGION repository variable (primary CI region, eu-west-1)
  session-name:
    required: true
    description: Session name recorded in CloudTrail for this run

runs:
  using: composite
  steps:
    - name: Require the AWS CI repository variables
      shell: bash
      env:
        ROLE_ARN: ${{ inputs.role-arn }}
        REGION: ${{ inputs.region }}
      run: |
        set -euo pipefail
        if [ -z "$ROLE_ARN" ]; then
          echo "::error::set the AWS_CI_ROLE_ARN repository variable by running docs/runbooks/aws-ci.md"
          exit 1
        fi
        if [ -z "$REGION" ]; then
          echo "::error::set the AWS_CI_REGION repository variable by running docs/runbooks/aws-ci.md"
          exit 1
        fi
        case "$REGION" in
          eu-west-1|eu-central-1|eu-north-1) ;;
          *) echo "::error::AWS_CI_REGION must be eu-west-1, eu-central-1, or eu-north-1 (DES-HOR-591-01); got $REGION"; exit 1 ;;
        esac
    - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.region }}
        role-session-name: ${{ inputs.session-name }}
        audience: sts.amazonaws.com
        mask-aws-account-id: "false"
        # OIDC assumption does not tag sessions today; skip explicitly so the
        # trust policy stays aud+sub only (DES-HOR-591-01).
        role-skip-session-tagging: "true"
    - name: Prove the assumed role and the fixed region
      shell: bash
      run: python3 .github/scripts/aws_ci.py verify-identity --region '${{ inputs.region }}'
