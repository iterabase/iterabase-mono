# Client object instances + supersede patches (client-owned paths).
#
# Composes the base instances (../base) and adds client-specific instances. To
# SUPERSEDE a base instance (same name), add a patch below; do not edit
# crds/base/. The overlay root kustomization.yaml composes this directory.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: overlay-crds-client
resources:
  - ../base
  - overlay-probe.yaml
# patches: []  # supersede base instances by identity (name)
