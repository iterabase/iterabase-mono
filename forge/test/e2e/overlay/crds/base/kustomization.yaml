# Product base CRD INSTANCES — upstream product config (clients never edit).
#
# Empty in this scaffold. Customer authority is the control plane's V2 browser
# session and credential model (HOR-582), never a CRD. Model/ModelBackend
# instances are deployment/client-specific and live in crds/client/.
#
# CRD *definitions* ship with the control-plane Helm chart — this overlay carries
# instances only.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: overlay-crds-base
resources: []
