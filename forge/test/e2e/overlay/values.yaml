# Base Helm values: E2E TEST FIXTURE (minimal).
#
# This overlay is the fixture for Forge's real-host E2E and the CI previews. It
# is intentionally minimal: beyond the settings below, the iterabase-platform
# chart's own E2E-friendly defaults apply (self-signed issuer, IPv4, MetalLB and
# external-dns disabled), so it deploys cleanly on a cloud VM.
#
# Forge renders the overlay on the operator machine and stages the value files
# on the host in the forge.yaml overlay.valueFiles order (later file wins):
#   valueFiles: [values.yaml, values.client.yaml]
# Runs append their own file (E2E image identities, preview values) last.

# Forge's cloud E2E disables k3s ServiceLB. Use a deterministic NodePort edge;
# the earlier migration-source stage separately proves MetalLB/L2 delivery.
ingress-nginx:
  controller:
    service:
      type: NodePort

# Sign-in is always on (HOR-582): the deployment overlay names the public
# origin, the verified-TLS mail relay, and the first Admin. Forge scenarios
# prove substrate mechanics, not mail delivery, so the relay is unreachable and
# the first-Admin setup intent simply stays pending in the outbox.
control-plane:
  auth:
    publicOrigin: https://app.forge-e2e.iterabase.test
    email:
      host: smtp.forge-e2e.iterabase.test
      from: Iterabase <no-reply@forge-e2e.iterabase.test>
    bootstrap:
      adminEmail: admin@forge-e2e.iterabase.test
