# control-plane example configuration. Copy to control-plane.yaml and edit.
# Environment variables (DATABASE_URL, API_ADDR, METRICS_ADDR, LOG_LEVEL, LOG_FORMAT,
# AUTH_*, TLS_CERT_FILE, TLS_KEY_FILE)
# override these values and are the preferred way to inject secrets in
# Kubernetes.
#
# The manager binary reads only DATABASE_URL from the environment; it does not
# load this file.

api:
  addr: ":8080"
  # TLS is opt-in. Set both to serve HTTPS (cert-manager leaf cert from the
  # internal CA, mounted by the control-plane chart when tls.enabled=true);
  # leave both unset for plain HTTP (kind/E2E/dev). Both or neither — not one.
  tls_cert_file: "${TLS_CERT_FILE}"   # e.g. /etc/control-plane/tls/tls.crt
  tls_key_file: "${TLS_KEY_FILE}"     # e.g. /etc/control-plane/tls/tls.key

# Optional plaintext, metrics-only in-cluster listener shared by whichever
# serving binary loads this config. Empty disables it. Never expose through an
# Ingress or merge it with the gateway/dispatch workload mTLS listener.
metrics:
  addr: "${METRICS_ADDR}"              # e.g. :9090

# Tool gateway (cmd/gateway, HOR-392). mTLS is REQUIRED (the workload
# boundary, not the dev HTTP API). The gateway serves the
# iterabase.gateway.v1 gRPC contract (RunnerService + GatewayService) over
# HTTP/2, verifying caller SPIFFE identities against client_ca_file. Env vars
# GATEWAY_ADDR / GATEWAY_TLS_CERT_FILE / GATEWAY_TLS_KEY_FILE /
# GATEWAY_CLIENT_CA_FILE / GATEWAY_TRUST_DOMAIN / GATEWAY_KUBE_NAMESPACE
# override these.
gateway:
  addr: ":8090"
  tls_cert_file: "${GATEWAY_TLS_CERT_FILE}"   # the gateway's workload leaf
  tls_key_file: "${GATEWAY_TLS_KEY_FILE}"
  client_ca_file: "${GATEWAY_CLIENT_CA_FILE}"  # SPIFFE/workload-identity CA bundle
  trust_domain: "iterabase.local"
  # Scopes Secret-read RBAC for credential-slot resolution (ARCH-008). The
  # gateway reads only named K8s Secrets in this namespace.
  kube_namespace: "${GATEWAY_KUBE_NAMESPACE}"
  # Bounded inline JSON/text. Larger tool inputs/results use artifact refs.
  inline_limit: 65536
  # Mailbox intake and the platform mailbox tools (HOR-358). Off unless set.
  mailbox:
    enabled: true
  # Exact deployment-owned identities; reconciled fail-closed at gateway start.
  # Wildcards and empty namespace lists are rejected (HOR-397 / ARCH-015).
  approved_runners:
    - namespace: iterabase-system
      runner_id: overlay-tools
      spiffe_id: spiffe://iterabase.local/tool-runners/iterabase-system/overlay-tools
      allowed_tool_namespaces: [platform, graph]

# Immutable artifact service (HOR-399). API + gateway are the only MinIO
# clients; supervisors/runners/sandboxes use the gateway ArtifactService.
artifact:
  enabled: true
  endpoint: "${ARTIFACT_ENDPOINT}"       # e.g. iterabase-minio:9000
  access_key: "${ARTIFACT_ACCESS_KEY}"   # dedicated bucket-scoped credential
  secret_key: "${ARTIFACT_SECRET_KEY}"
  bucket: "iterabase-artifacts"
  secure: false                          # internal MinIO TLS when enabled
  max_size_bytes: 1073741824             # 1 GiB
  default_retention: ""                  # empty = indefinite
  pending_ttl: "1h"
  sweep_interval: "1m"

# Dispatch Work server (cmd/dispatch, HOR-249). mTLS is REQUIRED. The dispatch
# server serves the iterabase.harness.v1.Harness.Work bidi stream over HTTP/2,
# verifying warm-worker (supervisor) SPIFFE identities against client_ca_file.
# Env vars DISPATCH_ADDR / DISPATCH_TLS_CERT_FILE / DISPATCH_TLS_KEY_FILE /
# DISPATCH_CLIENT_CA_FILE / DISPATCH_TRUST_DOMAIN override these.
dispatch:
  addr: ":8091"
  tls_cert_file: "${DISPATCH_TLS_CERT_FILE}"   # the dispatch server's workload leaf
  tls_key_file: "${DISPATCH_TLS_KEY_FILE}"
  client_ca_file: "${DISPATCH_CLIENT_CA_FILE}"  # SPIFFE/workload-identity CA bundle
  trust_domain: "iterabase.local"

database:
  url: "${DATABASE_URL}"      # required; e.g. postgres://cp:cp@postgres:5432/controlplane?sslmode=disable
  max_open_conns: 25
  max_idle_conns: 10

logging:
  level: info                  # debug | info | warn | error
  format: json                 # json | text

# V2 authentication (HOR-453/582; docs/architecture/v2-authentication-authority.md).
# Sign-in is always on: the api/bootstrap containers fail closed without a
# valid exact public HTTPS origin, verified-TLS SMTP, and the first-Admin email.
# Session bounds below may only tighten the approved 12h idle / 720h absolute /
# 15m recent-password maximums.
auth:
  public_origin: "${AUTH_PUBLIC_ORIGIN}"   # e.g. https://app.example.com (no path)
  session:
    idle_ttl: ""            # <= 12h; empty uses the approved maximum
    absolute_ttl: ""        # <= 720h; empty uses the approved maximum
    recent_auth_ttl: ""     # <= 15m; empty uses the approved maximum
  trusted_proxies: []       # exact reverse-proxy CIDRs; the direct peer is trusted otherwise
  forwarded_header: "X-Forwarded-For"
  geoip_database: ""        # optional operator-mounted local GeoIP database path (advisory only)
  email:
    host: "${AUTH_SMTP_HOST}"
    port: 587
    mode: "starttls"        # starttls | tls (verified TLS is required)
    from: "${AUTH_SMTP_FROM}"
    username: "${AUTH_SMTP_USERNAME}"
    password: "${AUTH_SMTP_PASSWORD}"
    ca_file: ""             # optional PEM bundle for a private relay CA; never disables verification
  bootstrap:
    admin_email: "${AUTH_BOOTSTRAP_ADMIN_EMAIL}"
    admin_locale: "en"      # en | pt
